      seedSourceIds: [workflow-bootstrap]
    tenantProvisioning: event
    permissionRoots: [workflow]
    provisioningSeedIds: [workflow-permission-catalog, workflow-role-catalog, workflow-model-catalog]
    nacosConfigs: [omni-workflow.yml]
    ports: [8103, 19903, 9903]
    mq:
      producers: [workflow-domain-event, tenant-provision-result]
      consumers: [tenant-provisioning]
    xxl: { handlers: [mqRelayHandler], appNames: [omni-workflow] }
    docs: [docs/workflow.md]
    resourceHints: { minimumMemoryMb: 768, recommendedMemoryMb: 1024 }
    deprecation: { status: active }
    compatibility: { java: "25", node: ">=22.12.0", notes: [Flowable 8.0.0] }

  - id: crm
