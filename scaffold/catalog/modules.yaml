version: "1.0.0"

# 模块组合的单一事实来源。preset 只能引用这里的 id，不得复制依赖或初始化声明。
modules:
  - id: platform
    artifactId: omni-stack
    kind: foundation
    version: "1.0.0-SNAPSHOT"
    dependencies: []
    optionalModules: []
    conflicts: []
    backendModules:
      - omni-common-core
      - omni-common
      - omni-common-mybatis
      - omni-common-redis
      - omni-common-redis-reactive
      - omni-common-operlog
      - omni-common-job
      - omni-common-mqlog
      - omni-common-service
      - omni-db-migrator
    frontend:
      viewGlobs: []
      componentGlobs: []
      apiGlobs: []
      i18nGlobs: [omni-frontend/src/locales/*.ts]
      i18nPrefixes: [common, theme, lang, home, errorPage]
    gatewayRoutes: [block-internal-api, block-internal-api-services]
    composeServices: [omni-db-migrator, omni-frontend]
    database:
      changelogs: [database/changelog/platform/db.changelog-platform.yaml, database/changelog/common/db.changelog-common-mq.yaml]
      seedSourceIds: []
    tenantProvisioning: local
    permissionRoots: []
    provisioningSeedIds: [platform-default-tenant]
    nacosConfigs: [omni-common.yml]
    ports: [80, 3000]
    mq: { producers: [], consumers: [] }
    xxl: { handlers: [mqRelayHandler], appNames: [] }
    docs: [docs/architecture.md, docs/api-contract.md, docs/backend-patterns.md, docs/frontend-patterns.md, docs/core-flows.md, docs/mq-reliability.md, docs/docker-deployment.md]
    resourceHints: { minimumMemoryMb: 768, recommendedMemoryMb: 1536 }
    deprecation: { status: active }
    compatibility: { java: "25", node: ">=22.12.0", notes: [Spring Boot 4.0.6] }

  - id: auth
    artifactId: omni-auth
    kind: foundation
    version: "1.0.0-SNAPSHOT"
    dependencies: [platform]
    optionalModules: [rocketmq, xxl-job]
    conflicts: []
    backendModules: [omni-auth]
    frontend:
      viewGlobs: [omni-frontend/src/views/system, omni-frontend/src/views/login, omni-frontend/src/views/register, omni-frontend/src/views/oauth2-client, omni-frontend/src/views/callback, omni-frontend/src/views/device, omni-frontend/src/views/consent]
      componentGlobs: [omni-frontend/src/components/LoginForm.vue]
      apiGlobs: [omni-frontend/src/api/auth.ts, omni-frontend/src/api/user.ts, omni-frontend/src/api/role.ts, omni-frontend/src/api/permission.ts, omni-frontend/src/api/tenant.ts, omni-frontend/src/api/org.ts, omni-frontend/src/api/oauth2-client.ts, omni-frontend/src/api/auth-record.ts, omni-frontend/src/api/audit-log.ts, omni-frontend/src/api/online.ts, omni-frontend/src/api/xss-config.ts]
      i18nGlobs: [omni-frontend/src/locales/*.ts]
      i18nPrefixes: [user, role, org, tenant, online, authRecord, auditLog, permission, oauth2Client, xssConfig, login, register, device, consent]
    gatewayRoutes: [omni-auth-oauth2, omni-auth-wellknown, omni-auth]
    composeServices: [omni-auth]
    database:
      changelogs: [database/changelog/auth/db.changelog-auth.yaml]
      seedSourceIds: [auth-bootstrap]
    tenantProvisioning: local
    permissionRoots: [system]
    provisioningSeedIds: [auth-default-root, auth-role-catalog, auth-permission-catalog, auth-xss-defaults]
    nacosConfigs: [omni-auth.yml]
    ports: [8100, 19900, 9900]
    mq:
      producers: [auth-portal-role-result, tenant-provisioning]
      consumers: [srm-domain-event, tenant-provision-result]
    xxl: { handlers: [mqRelayHandler], appNames: [omni-auth] }
    docs: [docs/core-flows.md]
    resourceHints: { minimumMemoryMb: 512, recommendedMemoryMb: 768 }
    deprecation: { status: active }
    compatibility: { java: "25", node: ">=22.12.0", notes: [OAuth2 Authorization Server] }

  - id: base
    artifactId: omni-base
    kind: foundation
    version: "1.0.0-SNAPSHOT"
    dependencies: [auth]
    optionalModules: [rocketmq, xxl-job]
    conflicts: []
    backendModules: [omni-base]
    frontend:
      viewGlobs: [omni-frontend/src/views/base, omni-frontend/src/views/job, omni-frontend/src/views/monitor, omni-frontend/src/views/home, omni-frontend/src/views/dashboard, omni-frontend/src/views/error]
      componentGlobs: [omni-frontend/src/components/CronGenerator.vue, omni-frontend/src/components/DynamicFormRenderer.vue, omni-frontend/src/components/SchemaFieldEditor.vue, omni-frontend/src/components/SidebarMenu.vue]
      apiGlobs: [omni-frontend/src/api/dict.ts, omni-frontend/src/api/menu.ts, omni-frontend/src/api/mqMessage.ts, omni-frontend/src/api/myJob.ts, omni-frontend/src/api/oper-log.ts, omni-frontend/src/api/systemJob.ts, omni-frontend/src/api/userJobType.ts]
      i18nGlobs: [omni-frontend/src/locales/*.ts]
      i18nPrefixes: [dict, operLog, mqMessage, userJobType, userJob, userJobLog, workspace, cron, systemJob]
    gatewayRoutes: [omni-base, omni-base-job]
    composeServices: [omni-base]
    database:
      changelogs: [database/changelog/base/db.changelog-base.yaml]
      seedSourceIds: [base-bootstrap]
    tenantProvisioning: event
    permissionRoots: [base, dict, job, monitor]
    provisioningSeedIds: [base-permission-catalog, base-dictionary-catalog, base-job-type-catalog]
    nacosConfigs: [omni-base.yml]
    ports: [8101, 19901, 9901]
    mq:
      producers: [operlog-topic, tenant-provision-result]
      consumers: [operlog-topic, tenant-provisioning]
    xxl: { handlers: [operLogArchiveHandler, userJobExecuteHandler, mqRelayHandler], appNames: [omni-base] }
    docs: [docs/scheduling.md]
    resourceHints: { minimumMemoryMb: 512, recommendedMemoryMb: 768 }
    deprecation: { status: active }
    compatibility: { java: "25", node: ">=22.12.0", notes: [XXL-JOB 可由功能开关关闭] }

