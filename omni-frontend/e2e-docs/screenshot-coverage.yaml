  - id: procurement
    status: partial
    required_flows: [material, approval-rule-match, requisition-approval, rfq, quotation-receipt, comparison, purchase-order, goods-receipt, overview]
    existing_assets:
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/procurement-overview.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/procurement-approval-rules.png
      - docs/images/zh-CN/procurement-approval-rules-mobile.png
      - docs/images/zh-CN/procurement-approval-rules-tablet.png
