  - id: permissions-exceptions
    status: covered
    required_flows: [employee-scope, procurement-admin-scope, supplier-scope, forbidden-403, not-found-404, menu-failure, api-failure]
    existing_assets:
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/employee-forbidden-403.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/employee-workspace-scope.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/supplier-portal-scope.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/resource-not-found-404.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/approval-route-list-failure.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/admin-menu-load-failure.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/procurement-approval-rules.png
    gaps: []
    # menu-failure 前次「白屏」结论经诊断推翻：降级页 /menu-load-error 完好（本地化标题 + 重试/回首页），
    # 首批失败为测试断言设计错误（降级页无 header 用户名），已修正断言后四语言 PASS。
    # api-failure/menu-failure 故障均为 deterministic test fault（page.route，仅测试进程）。
    # reproducible-fixture 已由 manifest fixture 字段 + 测试自建自清理多轮实证闭环。
  - id: scaffold-development
    status: missing
    required_flows: [create-service, crud-generate, preset-select, lite-mode]
    existing_assets: []
    gaps: [implementation-not-yet-delivered, all-scenes]
  - id: operations
    status: missing
    required_flows: [compose-start, health-check, trace, dashboard, alert]
    existing_assets: []
    gaps: [observability-not-yet-delivered, all-scenes]

rules:
  - 正式图片必须在 screenshot-manifest.yaml 中与稳定 Playwright 用例一一对应
  - 同一流程的四语言必须使用相同 fixture、步骤编号和视口
  - 正式图片不得包含验证码答案、令牌、内部密钥、真实密码或个人敏感数据
  - 临时图片在任务收尾时删除，只保留 manifest 引用的最终图片
