version: 1
baseline_date: 2026-08-21
status_values: [missing, partial, covered, exempt]
required_states: [entry, list, detail, create-or-edit, key-action, success, failure-or-forbidden]
locales: [zh-CN, en-US, ja-JP, ko-KR]
default_viewport: { width: 1440, height: 900 }

modules:
  - id: authentication
    status: covered
    required_flows: [password-captcha, register, social-login, device-code, expired-session]
    existing_assets:
      - docs/images/login.png
      - docs/images/register.png
      - docs/images/social-login-buttons.png
      - docs/images/social-consent.png
      - docs/images/social-device-init.png
      - docs/images/social-device-verify.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/auth-login.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/auth-register.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/auth-device-code.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/supplier-portal-login.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/session-expired-dialog.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/employee-forbidden-403.png
    gaps: []
    # expired-session：确定性测试故障（page.route 拦截待办接口 401，仅测试进程），
    # 产品真实 handle401 弹出本地化过期对话框（标题/重新登录四语言）。
    # forbidden-state：权限拒绝状态由 permissions-exceptions 模块闭环
    # （employee-forbidden-403 四语言，AUTHENTICATED_BUT_FORBIDDEN 已区分 401）。
    # social-login 由既有 social-* 四图覆盖（coverage gaps 中本无此项）。
    # reproducible-fixture：manifest fixture 字段 + public 测试无 mutations 稳定重放。
  - id: system-management
    status: partial
    required_flows: [tenant, organization, user, role, permission, menu, data-scope, config, dictionary, oauth2, online-user, login-record, audit, xss]
    existing_assets:
      - docs/images/dashboard.png
      - docs/images/system-user.png
      - docs/images/system-dict.png
      - docs/images/system-xss.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/system-dashboard.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/system-users.png
    gaps: [most-management-flows, detail-and-action-states, failure-states]
  - id: scheduling-workspace
    status: covered
    required_flows: [system-job, job-type, personal-create, schedule, trigger, pause, resume, execution-log]
    existing_assets:
      - docs/images/job-system.png
      - docs/images/job-workspace.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/scheduling-system-jobs.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/scheduling-job-type.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/scheduling-personal-create-validation.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/scheduling-personal-lifecycle.png
    gaps: []
    # 前批 ja/ko 对话框交互失败根因已定位（TEST_DEFECT）：表单 label 误用 common.userJobTypes，
    # 真实 key 为 userJob.jobType（en/ja/ko = 'Job Type' 单数）；行操作按钮漏了 ko「편집」。
    # personal-create：UI 创建唯一名称任务（喝水提醒 demo handler，无外部副作用）
    #   + API fault（POST /base/my-job 500，仅测试进程）验证错误提示。
    # lifecycle：创建 → 编辑改名 → 列表真实反映（key action + success result）。
    # 清理：deleteMyJob 正式契约，E2E_MUTATIONS 自建自清理多轮实证。
  - id: messaging-monitoring
    status: partial
    required_flows: [message-status, retry, dead-letter, operation-log, trace-diagnosis]
    existing_assets:
      - docs/images/monitor-mqmessage.png
      - docs/images/monitor-operlog.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/monitor-mq-messages.png
    gaps: [retry, dead-letter, trace-diagnosis, detail-and-action-states]
  - id: workflow
    status: partial
    required_flows: [model-create, bpmn-design, candidate-config, validation, publish, start, approval, countersign, completion, instance-tracking]
    existing_assets:
      - docs/images/workflow-designer.png
      - docs/images/workflow-approval.png
