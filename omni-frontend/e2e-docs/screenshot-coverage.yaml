      - docs/images/crm-opportunity-board.png
      - docs/images/crm-activity-timeline.png
      - docs/images/crm-overview.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/crm-overview.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/crm-lead-create-validation.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/crm-lead-create-success.png
      - docs/images/{zh-CN,en-US,ja-JP,ko-KR}/crm-lead-forbidden-403.png
    gaps: []
    # detail-and-action-states：新建对话框表单 + 必填校验失败 + 创建成功（E2E_MUTATIONS 自建唯一线索，
    # finally deleteLead 正式契约清理，多次重跑实证 reproducible-fixture）。
    # permission-and-failure-states：employee-forbidden-403 四语言（AUTHENTICATED_BUT_FORBIDDEN）
    # + 业务校验失败（crmLead.nameRequired 四语言）。
  - id: srm
