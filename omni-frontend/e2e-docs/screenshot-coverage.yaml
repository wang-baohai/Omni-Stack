    # 图片质检拦截记录：首轮采集时「流转进度」弹层截到的是 BPMN 异步加载中的转圈态（画布空白），
    # 经质检发现后已在用例中补上就绪断言（`.bpmn-viewer-wrap .djs-element` 可见 + `.el-loading-mask` 已消失）并重拍，
    # 现图为完整渲染的真实流程图；未将加载态图片登记为正式资产。
    # 内容注意：当前实例均由历次 E2E（含本批）产生，标题带 E2ESQ 标识；实例属 Flowable 审计历史，
    # wf_process_instance_ext 无 deleted 列，不得用 SQL 硬删，故不为此造假数据或隐藏真实标题。
