# ============================================================
# Omni-Stack 本地开发 Docker Compose 配置（不得直接作为公网生产模板）
# ============================================================
# 包含：MySQL + one-shot 迁移器 + 中间件 + 后端微服务 + 前端
#
# 启动顺序：MySQL → DB Migrator → Nacos/XXL-JOB → 后端服务 → 前端
#
# 用法：
#   Windows: 右键 start.bat → 以管理员身份运行（自动处理端口保护）
#   Linux/Mac: ./start.sh
#   查看状态: docker compose ps
#   停止: stop.bat / ./stop.sh（默认保留命名卷）
#   清除数据: docker compose down -v（不可恢复，谨慎执行）
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL 8.4 — 主数据库
  # 端口: 3306 | 用户: root / .env 密码 | 数据库: omni_auth, omni_base, nacos_config
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: omni_auth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - omni-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
    healthcheck:
      # 强制走 TCP，避免初始化临时实例仅开放 Unix Socket 时被提前判定为健康。
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-db-migrator — Liquibase 一次性结构、账号与种子迁移
  # 迁移失败时保持非零退出，所有基础设施和应用服务禁止启动。
  # ----------------------------------------------------------
  omni-db-migrator:
    build:
      context: .
      dockerfile: docker/migrator/Dockerfile
    image: omni-db-migrator:latest
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      DB_MIGRATOR_COMMAND: migrate
      DB_MIGRATOR_ADMIN_URL: "jdbc:mysql://mysql:3306/?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      DB_MIGRATOR_ADMIN_USERNAME: root
      DB_MIGRATOR_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      DB_MIGRATOR_APP_USERNAME: omni_app
      DB_MIGRATOR_APP_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Redis 7.4 — 缓存与会话存储
  # 端口: 6379 | 密码由 .env 注入
  # ----------------------------------------------------------
  redis:
    image: redis:7.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Nacos v3.1.1 — 服务注册与配置中心（MySQL 外部存储）
  # 端口: 8080 (Console) / 8848 (API) / 9848 (gRPC)
  # 数据源: MySQL nacos_config 数据库（非嵌入式 Derby）
  # ----------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_NACOS_CONSOLE_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${OMNI_NACOS_API_HOST_PORT:-8848}:8848"
      - "127.0.0.1:${OMNI_NACOS_GRPC_HOST_PORT:-9848}:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 .env 中配置 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请在 .env 中配置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 .env 中配置 NACOS_AUTH_IDENTITY_VALUE}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
    depends_on:
      omni-db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # RocketMQ 5.3.2 — 操作日志消息队列
  # NameServer 端口: 9876 | Broker 端口: 10909/10911/10912
  # ----------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_ROCKETMQ_NAMESRV_HOST_PORT:-19876}:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_ROCKETMQ_FAST_HOST_PORT:-10909}:10909"
      - "127.0.0.1:${OMNI_ROCKETMQ_BROKER_HOST_PORT:-10911}:10911"
      - "127.0.0.1:${OMNI_ROCKETMQ_HA_HOST_PORT:-10912}:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Drocketmq.broker.diskSpaceWarningLevelRatio=0.98"
    volumes:
      - ./docker/rocketmq/broker-docker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # XXL-JOB Admin v3.3.1 — 分布式任务调度中心
  # 端口: 18080 (Web UI) | 数据库: xxl_job (复用 MySQL 实例)
  # 登录账号与密码、执行器 accessToken 均由 .env 注入
  # ----------------------------------------------------------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_XXL_JOB_HOST_PORT:-18080}:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
        --xxl.job.login.username=${XXL_JOB_ADMIN_USERNAME:?请在 .env 中配置 XXL_JOB_ADMIN_USERNAME}
        --xxl.job.login.password=${XXL_JOB_ADMIN_PASSWORD:?请在 .env 中配置 XXL_JOB_ADMIN_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
    depends_on:
      omni-db-migrator:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ===========================================================
  # 后端微服务（多阶段构建：Maven 编译 + JRE 运行）
  # ===========================================================

  # ----------------------------------------------------------
  # omni-auth — 认证授权服务 (Spring Authorization Server)
  # 宿主机端口: 8100 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-auth:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-auth
    image: omni-auth:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_AUTH_HOST_PORT:-8100}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      # Tomcat 最大请求头 32KB（admin JWT 约 8KB，防止下游服务 400）
      SERVER_MAX_HTTP_HEADER_SIZE: "32768"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-auth:9900/
      XXL_JOB_EXECUTOR_IP: omni-auth
      XXL_JOB_EXECUTOR_PORT: "9900"
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      AUTH_ISSUER: http://omni-auth:8080
      AUTH_FRONTEND_BASE_URL: http://localhost:3000
      AUTH_OAUTH2_GITHUB_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/github/callback
      AUTH_OAUTH2_GITEE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/gitee/callback
      AUTH_OAUTH2_GOOGLE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/google/callback
      # OAuth2 第三方凭证（通过 .env 文件注入，真实值不要提交到仓库）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITEE_CLIENT_ID: ${GITEE_CLIENT_ID:-}
      GITEE_CLIENT_SECRET: ${GITEE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_STATE_SECRET: ${OAUTH2_STATE_SECRET:?请在 .env 中配置 OAUTH2_STATE_SECRET}
      # JWK 密钥 AES 加密密钥（用于将 RSA 密钥库加密后存入 Redis）
      JWK_ENCRYPT_KEY: ${JWK_ENCRYPT_KEY:?请在 .env 中配置 JWK_ENCRYPT_KEY}
      # 内部 API 认证 Token
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
      # HTTP 代理配置（用于访问 Google API，需要宿主机运行代理服务）
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
      NO_PROXY: localhost,127.0.0.1,mysql,redis,nacos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-base — 基础数据服务 (字典/组织/用户/日志/任务)
  # 宿主机端口: 8101 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-base:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-base
    image: omni-base:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_BASE_HOST_PORT:-8101}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      SPRING_CLOUD_STREAM_ROCKETMQ_BINDER_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-base:9901/
      XXL_JOB_EXECUTOR_IP: omni-base
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-workflow — 工作流引擎服务 (Flowable)
  # 宿主机端口: 8103 | 容器内部端口: 8080 | XXL执行器: 9903
  # ----------------------------------------------------------
  omni-workflow:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-workflow
    image: omni-workflow:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_WORKFLOW_HOST_PORT:-8103}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_workflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      SPRING_CLOUD_STREAM_ROCKETMQ_BINDER_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-workflow:9903/
      XXL_JOB_EXECUTOR_IP: omni-workflow
      XXL_JOB_EXECUTOR_PORT: "9903"
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      # 内部 API 认证 Token（Feign 调用 omni-auth 时使用）
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-crm — 客户关系管理服务
  # 宿主机端口: 8104 | 容器内部端口: 8080 | XXL执行器: 9904
  # ----------------------------------------------------------
  omni-crm:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-crm
    image: omni-crm:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNI_CRM_HOST_PORT:-8104}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_URL: "jdbc:mysql://mysql:3306/omni_crm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: omni_app
      MYSQL_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-crm:9904/
      XXL_JOB_EXECUTOR_IP: omni-crm
      XXL_JOB_EXECUTOR_PORT: "9904"
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
      omni-auth:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-gateway — API 网关 (Spring Cloud Gateway WebFlux)
  # 宿主机端口: 8102 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-gateway:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-gateway
    image: omni-gateway:latest
    restart: unless-stopped
    ports:
      - "${OMNI_GATEWAY_HOST_PORT:-8102}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      AUTH_JWKS_URI: http://omni-auth:8080/oauth2/jwks
      # Netty HTTP 解码器最大 Header 尺寸 64KB（JWT scope 较大）
      JAVA_OPTS: "-Dreactor.netty.http.server.maxHeaderSize=65536"
    depends_on:
      omni-db-migrator:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      omni-auth:
        condition: service_healthy
      omni-crm:
        condition: service_healthy
      omni-srm:
        condition: service_healthy
      omni-procurement:
        condition: service_healthy
      omni-asset:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-srm — 供应商关系管理服务
  # 宿主机端口: 8105 | 容器内部端口: 8080 | XXL执行器: 9905
  # ----------------------------------------------------------
  omni-srm:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-srm
    image: omni-srm:latest
    restart: unless-stopped
    ports:
      # 业务端口仅绑定回环地址；生产流量必须经 Gateway。
      - "127.0.0.1:${OMNI_SRM_HOST_PORT:-8105}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      NACOS_SERVER_ADDR: nacos:8848
