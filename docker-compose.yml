# ============================================================
# Omni-Stack 全家桶 Docker Compose 配置
# ============================================================
# 包含：中间件（MySQL/Redis/RocketMQ/Nacos/XXL-JOB）+ 后端微服务 + 前端
#
# 启动顺序：MySQL/Redis/RocketMQ → Nacos/XXL-JOB → 后端服务 → 前端
#
# 用法：
#   Windows: 右键 start.bat → 以管理员身份运行（自动处理端口保护）
#   Linux/Mac: ./start.sh
#   查看状态: docker compose ps
#   停止: stop.bat / ./stop.sh（数据随之清除）
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL 8.4 — 主数据库
  # 端口: 3306 | 用户: root/root | 数据库: omni_auth, omni_base, nacos_config
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: omni-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: omni_auth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/sql/init-all.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sql/init-nacos.sql:/docker-entrypoint-initdb.d/02-init-nacos.sql:ro
      - ./scripts/sql/init-xxl-job.sql:/docker-entrypoint-initdb.d/03-init-xxl-job.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Redis 7.4 — 缓存与会话存储
  # 端口: 6379 | 无密码
  # ----------------------------------------------------------
  redis:
    image: redis:7.4
    container_name: omni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Nacos v3.1.1 — 服务注册与配置中心（MySQL 外部存储）
  # 端口: 8080 (Console) / 8848 (API) / 9848 (gRPC)
  # 数据源: MySQL nacos_config 数据库（非嵌入式 Derby）
  # ----------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: omni-nacos
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # RocketMQ 5.3.2 — 操作日志消息队列
  # NameServer 端口: 9876 | Broker 端口: 10909/10911/10912
  # ----------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: omni-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "19876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: omni-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Drocketmq.broker.diskSpaceWarningLevelRatio=0.98"
    volumes:
      - ./docker/rocketmq/broker-docker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # XXL-JOB Admin v3.3.1 — 分布式任务调度中心
  # 端口: 18080 (Web UI) | 数据库: xxl_job (复用 MySQL 实例)
  # 默认账号: admin/123456
  # ----------------------------------------------------------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.1
    container_name: omni-xxl-job-admin
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.login.username=admin
        --xxl.job.login.password=123456
        --xxl.job.accessToken=
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ===========================================================
  # 后端微服务（多阶段构建：Maven 编译 + JRE 运行）
  # ===========================================================

  # ----------------------------------------------------------
  # omni-auth — 认证授权服务 (Spring Authorization Server)
  # 宿主机端口: 8100 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-auth:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-auth
    image: omni-auth:latest
    container_name: omni-auth
    restart: unless-stopped
    ports:
      - "8100:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: omni_app_pass
      SPRING_DATA_REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-auth:9900/
      XXL_JOB_EXECUTOR_IP: omni-auth
      XXL_JOB_EXECUTOR_PORT: "9900"
      AUTH_ISSUER: http://omni-auth:8080
      AUTH_FRONTEND_BASE_URL: http://localhost:3000
      AUTH_OAUTH2_GITHUB_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/github/callback
      AUTH_OAUTH2_GITEE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/gitee/callback
      AUTH_OAUTH2_GOOGLE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/google/callback
      # OAuth2 第三方凭证（通过 .env 文件注入，真实值不要提交到仓库）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-your-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-your-github-client-secret}
      GITEE_CLIENT_ID: ${GITEE_CLIENT_ID:-your-gitee-client-id}
      GITEE_CLIENT_SECRET: ${GITEE_CLIENT_SECRET:-your-gitee-client-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      OAUTH2_STATE_SECRET: ${OAUTH2_STATE_SECRET:-change-this-to-random-secret}
      # JWK 密钥 AES 加密密钥（用于将 RSA 密钥库加密后存入 Redis）
      JWK_ENCRYPT_KEY: ${JWK_ENCRYPT_KEY:-change-this-32chars-aes-key!!}
      # 内部 API 认证 Token
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
      # HTTP 代理配置（用于访问 Google API，需要宿主机运行代理服务）
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
      NO_PROXY: localhost,127.0.0.1,mysql,redis,nacos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-base — 基础数据服务 (字典/组织/用户/日志/任务)
  # 宿主机端口: 8101 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-base:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-base
    image: omni-base:latest
    container_name: omni-base
    restart: unless-stopped
    ports:
      - "8101:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: omni_app_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_STREAM_ROCKETMQ_BINDER_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-base:9901/
      XXL_JOB_EXECUTOR_IP: omni-base
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-workflow — 工作流引擎服务 (Flowable)
  # 宿主机端口: 8103 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-workflow:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-workflow
    image: omni-workflow:latest
    container_name: omni-workflow
    restart: unless-stopped
    ports:
      - "8103:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omni_workflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: omni_app_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_STREAM_ROCKETMQ_BINDER_NAME_SERVER: rocketmq-namesrv:9876
      # 内部 API 认证 Token（Feign 调用 omni-auth 时使用）
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-crm — 客户关系管理服务
  # 宿主机端口: 8104 | 容器内部端口: 8080 | XXL执行器: 9904
  # ----------------------------------------------------------
  omni-crm:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-crm
    image: omni-crm:latest
    container_name: omni-crm
    restart: unless-stopped
    ports:
      - "8104:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_URL: "jdbc:mysql://mysql:3306/omni_crm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: omni_app
      MYSQL_PASSWORD: omni_app_pass
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-crm:9904/
      XXL_JOB_EXECUTOR_IP: omni-crm
      XXL_JOB_EXECUTOR_PORT: "9904"
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
      omni-auth:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-gateway — API 网关 (Spring Cloud Gateway WebFlux)
  # 宿主机端口: 8102 | 容器内部端口: 8080
  # ----------------------------------------------------------
  omni-gateway:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-gateway
    image: omni-gateway:latest
    container_name: omni-gateway
    restart: unless-stopped
    ports:
      - "8102:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATA_REDIS_HOST: redis
      AUTH_JWKS_URI: http://omni-auth:8080/oauth2/jwks
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      omni-auth:
        condition: service_healthy
      omni-crm:
        condition: service_healthy
      omni-srm:
        condition: service_healthy
    networks:
      - omni-network

  # ----------------------------------------------------------
  # omni-srm — 供应商关系管理服务
  # 宿主机端口: 8105 | 容器内部端口: 8080 | XXL执行器: 9905
  # ----------------------------------------------------------
  omni-srm:
    build:
      context: ./omni-backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-srm
    image: omni-srm:latest
    container_name: omni-srm
    restart: unless-stopped
    ports:
      # 业务端口仅绑定回环地址；生产流量必须经 Gateway。
      - "127.0.0.1:8105:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: default
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_URL: "jdbc:mysql://mysql:3306/omni_srm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: omni_app
      MYSQL_PASSWORD: omni_app_pass
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-srm:9905/
      XXL_JOB_EXECUTOR_IP: omni-srm
      XXL_JOB_EXECUTOR_PORT: "9905"
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
      omni-auth:
        condition: service_healthy
    networks:
      - omni-network

  # ===========================================================
  # 前端应用（多阶段构建：npm build + Nginx）
  # ===========================================================

  # ----------------------------------------------------------
  # omni-frontend — Vue 3 前端 (Nginx)
  # 端口: 3000 | 静态文件 + 反代 Gateway
  # ----------------------------------------------------------
  omni-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: omni-frontend:latest
    container_name: omni-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      omni-gateway:
        condition: service_healthy
    networks:
      - omni-network

networks:
  omni-network:
    driver: bridge
