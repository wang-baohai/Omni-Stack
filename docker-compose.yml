# ============================================================
# Omni-Stack 中间件 Docker Compose 配置
# ============================================================
# 启动顺序：MySQL/Redis/RocketMQ → Nacos → 后端服务 → 前端
#
# 用法：
#   Windows: 右键 start.bat → 以管理员身份运行（自动处理端口保护）
#   Linux/Mac: ./start.sh
#   仅启动指定服务: start.bat mysql redis  或  ./start.sh mysql redis
#   查看状态: docker compose ps
#   停止: stop.bat / ./stop.sh（数据随之清除）
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL 8.4 — 主数据库
  # 端口: 3306 | 用户: root/root | 数据库: omni_auth, omni_base, nacos_config
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: omni-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: omni_auth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/sql/init-all.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sql/init-nacos.sql:/docker-entrypoint-initdb.d/02-init-nacos.sql:ro
      - ./scripts/sql/init-xxl-job.sql:/docker-entrypoint-initdb.d/03-init-xxl-job.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Redis 7.4 — 缓存与会话存储
  # 端口: 6379 | 无密码
  # ----------------------------------------------------------
  redis:
    image: redis:7.4
    container_name: omni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # Nacos v3.1.1 — 服务注册与配置中心（MySQL 外部存储）
  # 端口: 8080 (Console) / 8848 (API) / 9848 (gRPC)
  # 数据源: MySQL nacos_config 数据库（非嵌入式 Derby）
  # ----------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: omni-nacos
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # RocketMQ 5.3.2 — 操作日志消息队列
  # NameServer 端口: 9876 | Broker 端口: 10909/10911/10912
  # ----------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: omni-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: omni-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Drocketmq.broker.diskSpaceWarningLevelRatio=0.98"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

  # ----------------------------------------------------------
  # XXL-JOB Admin v3.3.1 — 分布式任务调度中心
  # 端口: 18080 (Web UI) | 数据库: xxl_job (复用 MySQL 实例)
  # 默认账号: admin/123456
  # ----------------------------------------------------------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.1
    container_name: omni-xxl-job-admin
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.login.username=admin
        --xxl.job.login.password=123456
        --xxl.job.accessToken=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni-network

networks:
  omni-network:
    driver: bridge
