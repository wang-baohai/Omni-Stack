spring:
  application:
    name: omni-db-migrator
  main:
    web-application-type: none
    banner-mode: "off"

omni:
  db-migrator:
    command: ${DB_MIGRATOR_COMMAND:validate}
    admin-url: ${DB_MIGRATOR_ADMIN_URL:}
    admin-username: ${DB_MIGRATOR_ADMIN_USERNAME:}
    admin-password: ${DB_MIGRATOR_ADMIN_PASSWORD:}
    app-username: ${DB_MIGRATOR_APP_USERNAME:omni_app}
    app-password: ${DB_MIGRATOR_APP_PASSWORD:}
    changelog-root: database/changelog/db.changelog-root.yaml
    seed-manifest: database/seed/manifest.yaml
    adoption-baseline: database/adoption/baseline-09a29fe.yaml
    backup-evidence: ${DB_MIGRATOR_BACKUP_EVIDENCE:}
    backup-max-age-hours: ${DB_MIGRATOR_BACKUP_MAX_AGE_HOURS:24}
    adopt-confirmation: ${DB_MIGRATOR_ADOPT_CONFIRMATION:}

logging:
  level:
    liquibase: info
    com.omni.dbmigrator: info
