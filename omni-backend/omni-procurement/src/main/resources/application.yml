server:
  port: 8106
  max-http-header-size: 32KB
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true

spring:
  application:
    name: omni-procurement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    function:
      definition: workflowCompletionFunction;quotationSubmittedFunction;tenantProvisionRequestedFunction
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    stream:
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
      bindings:
        operlog-out-0:
          destination: operlog-topic
          content-type: application/json
        procurement-domain-out-0:
          destination: procurement-domain-event
          content-type: application/json
        workflowCompletionFunction-in-0:
          destination: workflow-domain-event
          content-type: application/json
          group: omni-procurement-workflow-completion
        quotationSubmittedFunction-in-0:
          destination: srm-domain-event
          content-type: application/json
          group: omni-procurement-quotation-submitted
        tenantProvisionRequestedFunction-in-0:
          destination: tenant-provisioning
          content-type: application/json
          group: procurement-tenant-provision-group
        tenantProvisionResult-out-0:
          destination: tenant-provision-result
          content-type: application/json
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/omni_procurement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}

management:
  server:
    port: ${MANAGEMENT_PORT:19906}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    tags:
      service.name: ${spring.application.name}
      environment: ${OMNI_ENVIRONMENT:local}
      instance: ${HOSTNAME:local}
  endpoint:
    health:
      show-details: when_authorized

omni:
  service:
    name: omni-procurement
    display-name: Procurement
    gateway-preauth:
      enabled: true
    internal-api:
      enabled: true
      token: ${OMNI_INTERNAL_API_TOKEN:}
    tenant:
      enabled: true
    data-scope:
      enabled: true
    xss:
      enabled: true
  internal:
    api:
      token: ${OMNI_INTERNAL_API_TOKEN:}

xxl:
  job:
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
      username: ${XXL_JOB_ADMIN_USERNAME:admin}
      password: ${XXL_JOB_ADMIN_PASSWORD:123456}
    executor:
      enabled: ${XXL_JOB_ENABLED:true}
      appname: omni-procurement
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9906}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}

logging:
  level:
    com.omni.procurement: info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
