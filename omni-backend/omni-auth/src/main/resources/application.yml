server:
  port: 8100

management:
  server:
    port: 19900
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: omni-auth
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:omni-auth.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: 127.0.0.1
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/omni_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Spring Authorization Server OAuth2 Config
auth:
  issuer: http://localhost:8100
  frontend:
    base-url: http://localhost:3000
    login-url: ${auth.frontend.base-url}/login?oauth2=true
    callback-url: ${auth.frontend.base-url}/callback
    device-verify-url: ${auth.frontend.base-url}/device/verify
  token:
    access-token-ttl: 7200
    refresh-token-ttl: 604800
  captcha:
    ttl-seconds: 300
  oauth2:
    github:
      client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
      client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/github/callback}
    gitee:
      client-id: ${GITEE_CLIENT_ID:your-gitee-client-id}
      client-secret: ${GITEE_CLIENT_SECRET:your-gitee-client-secret}
      redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/gitee/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/google/callback}
    state-secret: ${OAUTH2_STATE_SECRET:your-state-secret-change-me}
    frontend-callback-url: ${auth.frontend.base-url}/callback

# JWK 密钥持久化配置（AES-256-GCM 加密后存入 Redis）
jwk:
  encrypt-key: ${JWK_ENCRYPT_KEY:}

# 内部 API 认证配置（服务间 Feign 调用使用 X-Internal-Token 校验）
omni:
  internal:
    api:
      token: ${OMNI_INTERNAL_API_TOKEN:}

logging:
  level:
    com.omni.auth.mapper: debug
    org.springframework.security: debug
