server:
  port: 8100

spring:
  application:
    name: omni-auth
  profiles:
    active: dev
    group:
      dev:
        include: local
  config:
    import:
      - optional:nacos:omni-auth.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: nacos
        file-extension: yml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/omni_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# MyBatis-Plus 开发环境配置（通用配置由 omni-common-mybatis 提供）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Spring Authorization Server OAuth2 Config
auth:
  issuer: http://localhost:8100
  frontend:
    base-url: http://localhost:3000
    login-url: ${auth.frontend.base-url}/login?oauth2=true
    callback-url: ${auth.frontend.base-url}/callback
    device-verify-url: ${auth.frontend.base-url}/device/verify
  token:
    access-token-ttl: 7200
    refresh-token-ttl: 604800
  captcha:
    ttl-seconds: 300
  oauth2:
    github:
      client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
      client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/github/callback}
    gitee:
      client-id: ${GITEE_CLIENT_ID:your-gitee-client-id}
      client-secret: ${GITEE_CLIENT_SECRET:your-gitee-client-secret}
      redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/gitee/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8100/api/auth/oauth2/google/callback}
    state-secret: ${OAUTH2_STATE_SECRET:your-state-secret-change-me}
    frontend-callback-url: ${auth.frontend.base-url}/callback
  jwk:
    key-id: omni-auth-key
    private-key: |
      -----BEGIN EC PRIVATE KEY-----
      MHcCAQEEIBHbO1jWq0oMQCf5hJ1Fz9oOuP5b3n5hJ1Fz9oOuP5boAoGCCqGSM49
      AwEHoUQDQgAEXAMPLE_KEY_FOR_DEVELOPMENT_ONLY_REPLACE_IN_PRODUCTION
      -----END EC PRIVATE KEY-----
    public-key: |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEXAMPLE_KEY_FOR_DEVELOPMENT_ONLY
      -----END PUBLIC KEY-----

logging:
  level:
    com.omni.auth.mapper: debug
    org.springframework.security: debug
