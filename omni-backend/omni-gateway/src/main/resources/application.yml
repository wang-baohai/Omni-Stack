server:
  port: 8102

spring:
  application:
    name: omni-gateway
  config:
    import:
      - optional:nacos:omni-gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # OAuth2 authorization server endpoints (必须在 omni-auth 路由之前)
            - id: omni-auth-oauth2
              uri: lb://omni-auth
              predicates:
                - Path=/oauth2/**
            # OpenID Connect discovery endpoint
            - id: omni-auth-wellknown
              uri: lb://omni-auth
              predicates:
                - Path=/.well-known/**
            # Auth service REST API routes
            - id: omni-auth
              uri: lb://omni-auth
              predicates:
                - Path=/api/auth/**
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

auth:
  jwks:
    uri: http://localhost:8100/oauth2/jwks
    cache-ttl: 5m

logging:
  level:
    com.omni.gateway: debug
    org.springframework.cloud.gateway: debug
