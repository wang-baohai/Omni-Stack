server:
  port: 8090

spring:
  application:
    name: omni-gateway
  config:
    import:
      - optional:nacos:omni-gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # Business service routes
            - id: omni-business
              uri: lb://omni-business
              predicates:
                - Path=/api/business/**
              filters:
                - StripPrefix=2

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.omni.gateway: debug
    org.springframework.cloud.gateway: debug
