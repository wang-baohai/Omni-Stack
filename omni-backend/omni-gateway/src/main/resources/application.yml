server:
  port: 8102

spring:
  application:
    name: omni-gateway
  config:
    import:
      - optional:nacos:omni-gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        ip: 127.0.0.1
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            # 屏蔽内部 API 路由（防止通过服务发现路由访问 /internal/**）
            - id: block-internal-api
              uri: no://op
              predicates:
                - Path=/internal/**,/api/internal/**
              filters:
                - SetStatus=404
            - id: block-internal-api-services
              uri: no://op
              predicates:
                - Path=/omni-auth/internal/**,/omni-auth/api/internal/**,/omni-base/internal/**,/omni-base/api/internal/**,/omni-workflow/internal/**,/omni-workflow/api/internal/**,/omni-crm/internal/**,/omni-crm/api/internal/**,/omni-gateway/internal/**
              filters:
                - SetStatus=404
            # OAuth2 authorization server endpoints (必须在 omni-auth 路由之前)
            - id: omni-auth-oauth2
              uri: lb://omni-auth
              predicates:
                - Path=/oauth2/**
            # OpenID Connect discovery endpoint
            - id: omni-auth-wellknown
              uri: lb://omni-auth
              predicates:
                - Path=/.well-known/**
            # Auth service REST API routes
            - id: omni-auth
              uri: lb://omni-auth
              predicates:
                - Path=/api/auth/**
            # Base service route
            - id: omni-base
              uri: lb://omni-base
              predicates:
                - Path=/api/base/**
            # Job scheduler route (定时任务管理)
            - id: omni-base-job
              uri: lb://omni-base
              predicates:
                - Path=/api/job/**
            # Workflow engine route (工作流引擎)
            - id: omni-workflow
              uri: lb://omni-workflow
              predicates:
                - Path=/api/workflow/**
            # CRM 服务路由
            - id: omni-crm
              uri: lb://omni-crm
              predicates:
                - Path=/api/crm/**
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

management:
  server:
    port: 19902
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

auth:
  jwks:
    uri: http://localhost:8100/oauth2/jwks
    cache-ttl: 5m

logging:
  level:
    com.omni.gateway: debug
    org.springframework.cloud.gateway: debug
