server:
  port: 8090

spring:
  application:
    name: omni-gateway
  config:
    import:
      - optional:nacos:omni-gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # Auth service routes
            - id: omni-auth
              uri: lb://omni-auth
              predicates:
                - Path=/api/auth/**

            # Business service routes
            - id: omni-business
              uri: lb://omni-business
              predicates:
                - Path=/api/business/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

auth:
  jwks:
    uri: http://localhost:9000/oauth2/jwks
    cache-ttl: 5m

logging:
  level:
    com.omni.gateway: debug
    org.springframework.cloud.gateway: debug
