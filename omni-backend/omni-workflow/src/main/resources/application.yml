server:
  port: 8103
  max-http-header-size: 32KB

management:
  server:
    port: 19903
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: omni-workflow
  profiles:
    active: dev
    group:
      dev:
        include: local
  config:
    import:
      - optional:nacos:omni-workflow.yml
  cloud:
    function:
      definition: tenantProvisionRequestedFunction
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: 127.0.0.1
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    stream:
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876
      bindings:
        operlog-out-0:
          destination: operlog-topic
          content-type: application/json
        workflow-domain-out-0:
          destination: workflow-domain-event
          content-type: application/json
        tenantProvisionRequestedFunction-in-0:
          destination: tenant-provisioning
          content-type: application/json
          group: workflow-tenant-provision-group
        tenantProvisionResult-out-0:
          destination: tenant-provision-result
          content-type: application/json
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/omni_workflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Flowable 流程引擎配置
flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit

# 内部 API 认证配置（Feign 调用其他服务时携带 X-Internal-Token）
omni:
  internal:
    api:
      token: ${OMNI_INTERNAL_API_TOKEN:}

# 工作流领域事件 Outbox 中继执行器
xxl:
  job:
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
      username: ${XXL_JOB_ADMIN_USERNAME:admin}
      password: ${XXL_JOB_ADMIN_PASSWORD:123456}
    executor:
      enabled: ${XXL_JOB_ENABLED:true}
      appname: omni-workflow
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9903}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}

logging:
  level:
    com.omni.workflow: debug
