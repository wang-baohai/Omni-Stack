server:
  port: 8101

management:
  server:
    port: 19901
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: omni-base
  profiles:
    active: dev
    group:
      dev:
        include: local
  config:
    import:
      - optional:nacos:omni-base.yml
  cloud:
    function:
      definition: operlogConsumer
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: 127.0.0.1
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    stream:
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876
      bindings:
        operlog-out-0:
          destination: operlog-topic
          content-type: application/json
        operlogConsumer-in-0:
          destination: operlog-topic
          content-type: application/json
          group: operlog-consumer-group
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/omni_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

logging:
  level:
    com.omni.base.mapper: debug

# XXL-JOB 执行器配置
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
      username: admin
      password: ${XXL_JOB_PASSWORD:123456}
    executor:
      appname: omni-base
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: 9901
      logpath: ./logs/xxl-job
      logretentiondays: 30

# 内部 API 认证配置（Feign 调用其他服务时携带 X-Internal-Token）
omni:
  internal:
    api:
      token: ${OMNI_INTERNAL_API_TOKEN:}
