databaseChangeLog:
  - changeSet:
      id: crm-0001-baseline-schema
      author: omni-scaffold
      labels: database:crm
      runInTransaction: false
      comment: omni_crm 业务结构基线，不包含公共 MQ 表和种子数据
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE' AND table_name NOT IN ('DATABASECHANGELOG','DATABASECHANGELOGLOCK','sys_mq_message')
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `crm_activity` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `root_type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'LEAD/CUSTOMER/OPPORTUNITY',
                `root_id` bigint NOT NULL,
                `contact_id` bigint DEFAULT NULL,
                `activity_type` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `subject` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `content` text COLLATE utf8mb4_unicode_ci COMMENT '纯文本跟进内容',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL,
                `planned_start_time` datetime DEFAULT NULL,
                `planned_end_time` datetime DEFAULT NULL,
                `completed_time` datetime DEFAULT NULL,
                `next_action_time` datetime DEFAULT NULL,
                `performed_by_user_id` bigint DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_crm_activity_root` (`tenant_id`,`root_type`,`root_id`,`status`,`deleted`),
                KEY `idx_crm_activity_owner` (`tenant_id`,`owner_user_id`,`status`,`deleted`),
                KEY `idx_crm_activity_plan` (`tenant_id`,`planned_start_time`,`status`,`deleted`),
                KEY `idx_crm_activity_next` (`tenant_id`,`next_action_time`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM跟进活动';
              CREATE TABLE `crm_contact` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `customer_id` bigint NOT NULL COMMENT '客户ID',
                `name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '姓名',
                `department` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `job_title` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `mobile` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `phone` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `email` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `decision_role` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `primary_flag` tinyint NOT NULL DEFAULT '0',
                `status` tinyint NOT NULL DEFAULT '1',
                `owner_user_id` bigint NOT NULL COMMENT '负责人权限快照',
                `owner_unit_id` bigint NOT NULL COMMENT '组织权限快照',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `primary_customer_guard` bigint GENERATED ALWAYS AS ((case when ((`primary_flag` = 1) and (`status` = 1) and (`deleted` = 0)) then `customer_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_contact_primary` (`tenant_id`,`primary_customer_guard`),
                KEY `idx_crm_contact_customer` (`tenant_id`,`customer_id`,`status`,`deleted`),
                KEY `idx_crm_contact_owner` (`tenant_id`,`owner_user_id`,`deleted`),
                KEY `idx_crm_contact_mobile` (`tenant_id`,`mobile`),
                KEY `idx_crm_contact_email` (`tenant_id`,`email`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM客户联系人';
              CREATE TABLE `crm_customer` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `customer_no` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '客户编号',
                `name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '客户名称',
                `normalized_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '归一化名称',
                `customer_type` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `industry_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `level_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `source_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `credit_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '统一信用代码',
                `website` varchar(300) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `phone` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `email` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `region` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `address` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '生命周期状态',
                `owner_user_id` bigint NOT NULL COMMENT '负责人用户ID',
                `owner_unit_id` bigint NOT NULL COMMENT '负责人组织ID',
                `last_activity_time` datetime DEFAULT NULL,
                `next_followup_time` datetime DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_customer_no` (`tenant_id`,`customer_no`),
                KEY `idx_crm_customer_owner_status` (`tenant_id`,`owner_user_id`,`status`,`deleted`),
                KEY `idx_crm_customer_unit_status` (`tenant_id`,`owner_unit_id`,`status`,`deleted`),
                KEY `idx_crm_customer_name` (`tenant_id`,`normalized_name`,`deleted`),
                KEY `idx_crm_customer_credit` (`tenant_id`,`credit_code`),
                KEY `idx_crm_customer_phone` (`tenant_id`,`phone`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM客户';
              CREATE TABLE `crm_lead` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `lead_no` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '线索编号',
                `full_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '姓名',
                `company_name` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '公司名称',
                `job_title` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '职位',
                `mobile` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '手机',
                `phone` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '电话',
                `email` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '邮箱',
                `region` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '地区',
                `address` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '地址',
                `source_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '来源编码',
                `industry_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '行业编码',
                `rating` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '评级',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '生命周期状态',
                `disqualify_reason` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '无效原因',
                `owner_user_id` bigint NOT NULL COMMENT '负责人用户ID',
                `owner_unit_id` bigint NOT NULL COMMENT '负责人组织ID',
                `assigned_time` datetime DEFAULT NULL,
                `last_activity_time` datetime DEFAULT NULL,
                `next_followup_time` datetime DEFAULT NULL,
                `converted_time` datetime DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_lead_no` (`tenant_id`,`lead_no`),
                KEY `idx_crm_lead_owner_status` (`tenant_id`,`owner_user_id`,`status`,`deleted`),
                KEY `idx_crm_lead_unit_status` (`tenant_id`,`owner_unit_id`,`status`,`deleted`),
                KEY `idx_crm_lead_followup` (`tenant_id`,`next_followup_time`,`status`,`deleted`),
                KEY `idx_crm_lead_company` (`tenant_id`,`company_name`),
                KEY `idx_crm_lead_mobile` (`tenant_id`,`mobile`),
                KEY `idx_crm_lead_email` (`tenant_id`,`email`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM线索';
              CREATE TABLE `crm_lead_conversion` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `lead_id` bigint NOT NULL COMMENT '来源线索ID',
                `customer_id` bigint NOT NULL COMMENT '客户ID',
                `contact_id` bigint DEFAULT NULL COMMENT '联系人ID',
                `opportunity_id` bigint DEFAULT NULL COMMENT '商机ID',
                `converted_by_user_id` bigint NOT NULL COMMENT '转换用户ID',
                `converted_time` datetime NOT NULL COMMENT '转换时间',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_conversion_lead` (`tenant_id`,`lead_id`),
                KEY `idx_crm_conversion_customer` (`tenant_id`,`customer_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM线索转换事实';
              CREATE TABLE `crm_opportunity` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `opportunity_no` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '商机编号',
                `name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '商机名称',
                `customer_id` bigint NOT NULL COMMENT '客户ID',
                `primary_contact_id` bigint DEFAULT NULL,
                `source_lead_id` bigint DEFAULT NULL,
                `pipeline_id` bigint NOT NULL,
                `stage_id` bigint NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'OPEN/WON/LOST',
                `amount` decimal(18,2) NOT NULL DEFAULT '0.00',
                `currency_code` varchar(10) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '租户默认币种',
                `probability` decimal(5,2) NOT NULL DEFAULT '0.00',
                `expected_close_date` date DEFAULT NULL,
                `actual_close_time` datetime DEFAULT NULL,
                `loss_reason` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `stage_change_time` datetime NOT NULL,
                `next_followup_time` datetime DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_opportunity_no` (`tenant_id`,`opportunity_no`),
                KEY `idx_crm_opp_owner_status` (`tenant_id`,`owner_user_id`,`status`,`deleted`),
                KEY `idx_crm_opp_unit_status` (`tenant_id`,`owner_unit_id`,`status`,`deleted`),
                KEY `idx_crm_opp_stage` (`tenant_id`,`pipeline_id`,`stage_id`,`status`,`deleted`),
                KEY `idx_crm_opp_customer` (`tenant_id`,`customer_id`,`status`,`deleted`),
                KEY `idx_crm_opp_close_date` (`tenant_id`,`expected_close_date`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM商机';
              CREATE TABLE `crm_opportunity_stage_history` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `opportunity_id` bigint NOT NULL,
                `from_stage_id` bigint DEFAULT NULL,
                `to_stage_id` bigint NOT NULL,
                `from_status` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `to_status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL,
                `change_reason` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `changed_by_user_id` bigint NOT NULL,
                `changed_time` datetime NOT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_crm_opp_history` (`tenant_id`,`opportunity_id`,`changed_time`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM商机阶段历史';
              CREATE TABLE `crm_owner_change_log` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `entity_type` varchar(30) COLLATE utf8mb4_unicode_ci NOT NULL,
                `entity_id` bigint NOT NULL,
                `old_owner_user_id` bigint DEFAULT NULL,
                `old_owner_unit_id` bigint DEFAULT NULL,
                `new_owner_user_id` bigint NOT NULL,
                `new_owner_unit_id` bigint NOT NULL,
                `operation_type` varchar(30) COLLATE utf8mb4_unicode_ci NOT NULL,
                `reason` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `operator_user_id` bigint NOT NULL,
                `operated_time` datetime NOT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_crm_owner_change_entity` (`tenant_id`,`entity_type`,`entity_id`,`operated_time`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM负责人变更历史';
              CREATE TABLE `crm_pipeline` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '稳定编码',
                `name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '管道名称',
                `status` tinyint NOT NULL DEFAULT '1',
                `default_flag` tinyint NOT NULL DEFAULT '0',
                `sort` int NOT NULL DEFAULT '0',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_pipeline_code` (`tenant_id`,`code`),
                KEY `idx_crm_pipeline_status` (`tenant_id`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM销售管道';
              CREATE TABLE `crm_pipeline_stage` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `pipeline_id` bigint NOT NULL COMMENT '销售管道ID',
                `stage_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '阶段编码',
                `stage_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '阶段名称',
                `stage_type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'OPEN/WON/LOST',
                `probability` decimal(5,2) NOT NULL DEFAULT '0.00' COMMENT '成交概率百分比',
                `sort` int NOT NULL DEFAULT '0',
                `status` tinyint NOT NULL DEFAULT '1',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_stage_code` (`tenant_id`,`pipeline_id`,`stage_code`),
                KEY `idx_crm_stage_sort` (`tenant_id`,`pipeline_id`,`status`,`deleted`,`sort`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM销售管道阶段';
              CREATE TABLE `crm_tenant_config` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `default_pipeline_id` bigint DEFAULT NULL COMMENT '默认销售管道ID',
                `currency_code` varchar(10) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY' COMMENT '默认币种',
                `lead_duplicate_policy` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'WARN' COMMENT '线索重复策略',
                `initialized_time` datetime NOT NULL COMMENT '初始化时间',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_crm_config_tenant` (`tenant_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='CRM租户配置';
              SET FOREIGN_KEY_CHECKS = 1;
