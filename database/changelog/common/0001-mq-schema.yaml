databaseChangeLog:
  - changeSet:
      id: common-mq-0001-schema
      author: omni-scaffold
      labels: database:common-mq,adoption-baseline
      runInTransaction: false
      comment: 七个业务数据库复用的 Transactional Outbox 表结构
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'sys_mq_message'
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `sys_mq_message` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键',
                `msg_id` varchar(36) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '业务消息ID（UUID），防重投递',
                `topic` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'MQ Topic',
                `binding_name` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'Spring Cloud Stream binding name',
                `tag` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'MQ Tag（可选）',
                `msg_key` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '业务键（可选，如 order:12345）',
                `payload` text COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '消息体 JSON',
                `broker_type` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'rocketmq' COMMENT '消息中间件类型（预留多MQ扩展）',
                `status` tinyint NOT NULL DEFAULT '0' COMMENT '0=PENDING, 1=SENT, 2=FAILED, 3=DEAD_LETTER, 4=SKIPPED',
                `retry_count` int NOT NULL DEFAULT '0' COMMENT '已重试次数',
                `max_retry` int NOT NULL DEFAULT '3' COMMENT '最大重试次数',
                `next_retry_time` datetime DEFAULT NULL COMMENT '下次重试时间（指数退避）',
                `error_msg` varchar(512) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '最后一次失败错误信息',
                `service_name` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '来源服务名（spring.application.name）',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
                `update_time` datetime DEFAULT NULL ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_msg_id` (`msg_id`),
                KEY `idx_relay` (`status`,`next_retry_time`),
                KEY `idx_tenant_time` (`tenant_id`,`create_time`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='MQ消息发送记录表';
              SET FOREIGN_KEY_CHECKS = 1;
