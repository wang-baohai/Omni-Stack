databaseChangeLog:
  - changeSet:
      id: asset-0001-baseline-schema
      author: omni-scaffold
      labels: database:asset,adoption-baseline
      runInTransaction: false
      comment: omni_asset 业务结构基线，不包含公共 MQ 表和种子数据
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE' AND table_name NOT IN ('DATABASECHANGELOG','DATABASECHANGELOGLOCK','sys_mq_message')
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `ast_asset` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `asset_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `specification` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `brand` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `model` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `supplier_id` bigint DEFAULT NULL,
                `supplier_name_snapshot` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `source_po_id` bigint DEFAULT NULL,
                `source_gr_id` bigint DEFAULT NULL,
                `source_gr_line_id` bigint DEFAULT NULL,
                `source_unit_sequence` int DEFAULT NULL,
                `source_po_no` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `source_gr_no` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `purchase_date` date DEFAULT NULL,
                `purchase_amount` decimal(18,2) DEFAULT NULL,
                `currency_code` varchar(10) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY',
                `location_code` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'IN_STOCK',
                `current_user_id` bigint DEFAULT NULL,
                `current_unit_id` bigint DEFAULT NULL,
                `allocated_time` datetime DEFAULT NULL,
                `active_operation_type` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `active_operation_id` bigint DEFAULT NULL,
                `warranty_expiry_date` date DEFAULT NULL,
                `expected_life_years` int DEFAULT NULL,
                `remark` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_ast_asset_no` (`tenant_id`,`asset_no`),
                UNIQUE KEY `uk_ast_asset_tenant_id` (`tenant_id`,`id`),
                UNIQUE KEY `uk_ast_asset_source_unit` (`tenant_id`,`source_gr_line_id`,`source_unit_sequence`),
                UNIQUE KEY `uk_ast_asset_active_operation` (`tenant_id`,`active_operation_type`,`active_operation_id`),
                KEY `idx_ast_asset_owner_status` (`tenant_id`,`owner_unit_id`,`owner_user_id`,`status`),
                KEY `idx_ast_asset_current_user` (`tenant_id`,`current_user_id`,`status`),
                KEY `idx_ast_asset_current_unit` (`tenant_id`,`current_unit_id`,`status`),
                KEY `idx_ast_asset_category_status` (`tenant_id`,`category_code`,`status`),
                KEY `idx_ast_asset_active` (`tenant_id`,`active_operation_type`,`active_operation_id`),
                CONSTRAINT `chk_ast_asset_active_pair` CHECK ((((`active_operation_type` is null) and (`active_operation_id` is null)) or ((`active_operation_type` in (_utf8mb4'TRANSFER',_utf8mb4'DISPOSAL')) and (`active_operation_id` is not null)))),
                CONSTRAINT `chk_ast_asset_amount` CHECK (((`purchase_amount` is null) or (`purchase_amount` >= 0))),
                CONSTRAINT `chk_ast_asset_life` CHECK (((`expected_life_years` is null) or (`expected_life_years` > 0))),
                CONSTRAINT `chk_ast_asset_source_sequence` CHECK ((((`source_gr_line_id` is null) and (`source_unit_sequence` is null)) or ((`source_gr_line_id` is not null) and (`source_unit_sequence` > 0)))),
                CONSTRAINT `chk_ast_asset_status` CHECK ((`status` in (_utf8mb4'IN_STOCK',_utf8mb4'ALLOCATED',_utf8mb4'IN_USE',_utf8mb4'MAINTENANCE',_utf8mb4'TRANSFER',_utf8mb4'DISPOSAL_PENDING',_utf8mb4'DISPOSED',_utf8mb4'SCRAPPED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='资产台账';
              CREATE TABLE `ast_asset_history` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `asset_id` bigint NOT NULL,
                `from_status` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `to_status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `changed_by_user_id` bigint NOT NULL,
                `changed_time` datetime NOT NULL,
                `remark` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_ast_history_asset_time` (`tenant_id`,`asset_id`,`changed_time`,`id`),
                CONSTRAINT `fk_ast_history_asset` FOREIGN KEY (`tenant_id`, `asset_id`) REFERENCES `ast_asset` (`tenant_id`, `id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='资产不可变变更历史';
              CREATE TABLE `ast_disposal` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `disposal_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `asset_id` bigint NOT NULL,
                `disposal_type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL,
                `reason` varchar(1000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `previous_asset_status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `residual_value` decimal(18,2) DEFAULT NULL,
                `disposal_method` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING_APPROVAL',
                `active_flag` tinyint NOT NULL DEFAULT '1',
                `model_version_id` bigint NOT NULL,
                `workflow_start_user_id` bigint NOT NULL COMMENT 'Workflow 原始发起人用户 ID',
                `workflow_start_user_name` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'Workflow 原始发起人用户名快照',
                `workflow_request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `workflow_business_key` varchar(255) COLLATE utf8mb4_unicode_ci NOT NULL,
                `workflow_start_status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING',
                `process_instance_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `approved_time` datetime DEFAULT NULL,
                `completed_time` datetime DEFAULT NULL,
                `final_approver_user_id` bigint DEFAULT NULL,
                `final_approver_remark` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_ast_disposal_no` (`tenant_id`,`disposal_no`),
                UNIQUE KEY `uk_ast_disposal_workflow_request` (`tenant_id`,`workflow_request_id`),
                UNIQUE KEY `uk_ast_disposal_business_key` (`tenant_id`,`workflow_business_key`),
                KEY `idx_ast_disposal_asset_active` (`tenant_id`,`asset_id`,`active_flag`,`status`),
                KEY `idx_ast_disposal_process` (`tenant_id`,`process_instance_id`),
                CONSTRAINT `fk_ast_disposal_asset` FOREIGN KEY (`tenant_id`, `asset_id`) REFERENCES `ast_asset` (`tenant_id`, `id`),
                CONSTRAINT `chk_ast_disposal_active` CHECK ((`active_flag` in (0,1))),
                CONSTRAINT `chk_ast_disposal_residual` CHECK (((`residual_value` is null) or (`residual_value` >= 0))),
                CONSTRAINT `chk_ast_disposal_start` CHECK ((`workflow_start_status` in (_utf8mb4'PENDING',_utf8mb4'STARTED',_utf8mb4'FAILED'))),
                CONSTRAINT `chk_ast_disposal_status` CHECK ((`status` in (_utf8mb4'PENDING_APPROVAL',_utf8mb4'START_FAILED',_utf8mb4'APPROVED',_utf8mb4'REJECTED',_utf8mb4'COMPLETED',_utf8mb4'CANCELLED'))),
                CONSTRAINT `chk_ast_disposal_type` CHECK ((`disposal_type` in (_utf8mb4'DISCARD',_utf8mb4'SCRAP')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='资产处置申请';
              CREATE TABLE `ast_inbox_event` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `consumer_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `event_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `event_type` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL,
                `source_service` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `aggregate_type` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `aggregate_id` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `payload` json NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'RECEIVED',
                `processed_time` datetime DEFAULT NULL,
                `error_message` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_ast_inbox_consumer_event` (`consumer_name`,`event_id`),
                KEY `idx_ast_inbox_status` (`tenant_id`,`status`,`create_time`),
                CONSTRAINT `chk_ast_inbox_status` CHECK ((`status` in (_utf8mb4'RECEIVED',_utf8mb4'PROCESSED',_utf8mb4'IGNORED',_utf8mb4'FAILED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='资产跨服务领域事件收件箱';
              CREATE TABLE `ast_transfer` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `transfer_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `asset_id` bigint NOT NULL,
                `from_user_id` bigint DEFAULT NULL,
                `from_unit_id` bigint DEFAULT NULL,
                `to_user_id` bigint NOT NULL,
                `to_unit_id` bigint NOT NULL,
                `from_location` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `to_location` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `reason` varchar(1000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING_APPROVAL',
                `previous_asset_status` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `active_flag` tinyint NOT NULL DEFAULT '1',
                `model_version_id` bigint NOT NULL,
                `workflow_start_user_id` bigint NOT NULL COMMENT 'Workflow 原始发起人用户 ID',
                `workflow_start_user_name` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'Workflow 原始发起人用户名快照',
                `workflow_request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `workflow_business_key` varchar(255) COLLATE utf8mb4_unicode_ci NOT NULL,
                `workflow_start_status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING',
                `process_instance_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `approved_time` datetime DEFAULT NULL,
                `completed_time` datetime DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_ast_transfer_no` (`tenant_id`,`transfer_no`),
                UNIQUE KEY `uk_ast_transfer_workflow_request` (`tenant_id`,`workflow_request_id`),
                UNIQUE KEY `uk_ast_transfer_business_key` (`tenant_id`,`workflow_business_key`),
                KEY `idx_ast_transfer_asset_active` (`tenant_id`,`asset_id`,`active_flag`,`status`),
                KEY `idx_ast_transfer_process` (`tenant_id`,`process_instance_id`),
                CONSTRAINT `fk_ast_transfer_asset` FOREIGN KEY (`tenant_id`, `asset_id`) REFERENCES `ast_asset` (`tenant_id`, `id`),
                CONSTRAINT `chk_ast_transfer_active` CHECK ((`active_flag` in (0,1))),
                CONSTRAINT `chk_ast_transfer_start` CHECK ((`workflow_start_status` in (_utf8mb4'PENDING',_utf8mb4'STARTED',_utf8mb4'FAILED'))),
                CONSTRAINT `chk_ast_transfer_status` CHECK ((`status` in (_utf8mb4'PENDING_APPROVAL',_utf8mb4'START_FAILED',_utf8mb4'APPROVED',_utf8mb4'REJECTED',_utf8mb4'COMPLETED',_utf8mb4'CANCELLED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='资产调拨申请';
              SET FOREIGN_KEY_CHECKS = 1;
