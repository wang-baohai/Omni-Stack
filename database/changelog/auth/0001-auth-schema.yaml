databaseChangeLog:
  - changeSet:
      id: auth-0001-baseline-schema
      author: omni-scaffold
      labels: database:auth,adoption-baseline
      runInTransaction: false
      comment: omni_auth 业务结构基线，不包含公共 MQ 表和种子数据
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE' AND table_name NOT IN ('DATABASECHANGELOG','DATABASECHANGELOGLOCK','sys_mq_message')
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `oauth2_authorization` (
                `id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `registered_client_id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `principal_name` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `authorization_grant_type` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `authorized_scopes` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `attributes` text COLLATE utf8mb4_unicode_ci,
                `state` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `authorization_code_value` text COLLATE utf8mb4_unicode_ci,
                `authorization_code_issued_at` timestamp NULL DEFAULT NULL,
                `authorization_code_expires_at` timestamp NULL DEFAULT NULL,
                `authorization_code_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `access_token_value` text COLLATE utf8mb4_unicode_ci,
                `access_token_issued_at` timestamp NULL DEFAULT NULL,
                `access_token_expires_at` timestamp NULL DEFAULT NULL,
                `access_token_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `access_token_type` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `access_token_scopes` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `oidc_id_token_value` text COLLATE utf8mb4_unicode_ci,
                `oidc_id_token_issued_at` timestamp NULL DEFAULT NULL,
                `oidc_id_token_expires_at` timestamp NULL DEFAULT NULL,
                `oidc_id_token_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `refresh_token_value` text COLLATE utf8mb4_unicode_ci,
                `refresh_token_issued_at` timestamp NULL DEFAULT NULL,
                `refresh_token_expires_at` timestamp NULL DEFAULT NULL,
                `refresh_token_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `user_code_value` text COLLATE utf8mb4_unicode_ci,
                `user_code_issued_at` timestamp NULL DEFAULT NULL,
                `user_code_expires_at` timestamp NULL DEFAULT NULL,
                `user_code_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `device_code_value` text COLLATE utf8mb4_unicode_ci,
                `device_code_issued_at` timestamp NULL DEFAULT NULL,
                `device_code_expires_at` timestamp NULL DEFAULT NULL,
                `device_code_metadata` varchar(2000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `oauth2_authorization_consent` (
                `registered_client_id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `principal_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `authorities` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `scopes` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`registered_client_id`,`principal_name`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `oauth2_registered_client` (
                `id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `client_id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `client_id_issued_at` timestamp NULL DEFAULT CURRENT_TIMESTAMP,
                `client_secret` varchar(400) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `client_secret_expires_at` timestamp NULL DEFAULT NULL,
                `client_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `client_authentication_methods` varchar(1000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `authorization_grant_types` varchar(1000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `redirect_uris` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `post_logout_redirect_uris` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `scopes` varchar(1000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `client_settings` varchar(2000) COLLATE utf8mb4_unicode_ci NOT NULL,
                `token_settings` varchar(2000) COLLATE utf8mb4_unicode_ci NOT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_client_id` (`client_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `sys_audit_log` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '审计日志ID',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `event_type` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '事件类型: LOGIN_SUCCESS/LOGIN_FAILED/LOGOUT/ACCOUNT_LOCKED/ACCOUNT_UNLOCKED/PASSWORD_CHANGED/USER_CREATED/USER_DELETED/USER_STATUS_CHANGED/ROLE_ASSIGNED/ROLE_REVOKED',
                `username` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '操作目标用户名',
                `user_id` bigint DEFAULT NULL COMMENT '操作目标用户ID',
                `ip_address` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '客户端IP地址',
                `user_agent` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '客户端User-Agent',
                `description` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '事件描述',
                `extra` json DEFAULT NULL COMMENT '事件扩展字段（JSON）',
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '操作人（用户名或system）',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP COMMENT '事件发生时间',
                PRIMARY KEY (`id`),
                KEY `idx_audit_tenant` (`tenant_id`),
                KEY `idx_audit_event_type` (`event_type`),
                KEY `idx_audit_username` (`username`),
                KEY `idx_audit_create_time` (`create_time`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='安全审计日志表';
              CREATE TABLE `sys_org_unit` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '组织单元ID',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `parent_id` bigint DEFAULT '0' COMMENT '父节点ID',
                `name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '单元名称',
                `type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '类型: ORG/DEPT/TEAM/GROUP',
                `unit_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '单元编码（同父节点下唯一）',
                `path` varchar(500) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '物化路径',
                `depth` int NOT NULL DEFAULT '1' COMMENT '深度',
                `sort` int DEFAULT '0' COMMENT '排序',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_org_unit_parent_code` (`parent_id`,`unit_code`),
                KEY `idx_org_unit_tenant` (`tenant_id`),
                KEY `idx_org_unit_path` (`path`),
                KEY `idx_org_unit_tenant_parent` (`tenant_id`,`parent_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='组织单元表';
              CREATE TABLE `sys_permission` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '权限ID',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `parent_id` bigint DEFAULT '0' COMMENT '父权限ID',
                `permission_code` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '权限编码: resource:action',
                `permission_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '权限名称',
                `type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '类型: DIRECTORY/MENU/BUTTON/API',
                `path` varchar(500) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT '' COMMENT '物化路径',
                `depth` int DEFAULT '1' COMMENT '深度',
                `sort` int DEFAULT '0' COMMENT '排序',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_permission_tenant` (`tenant_id`),
                KEY `idx_permission_path` (`path`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='权限表';
              CREATE TABLE `sys_portal_role_request` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `supplier_id` bigint NOT NULL,
                `user_id` bigint NOT NULL,
                `role_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PROCESSING',
                `error_code` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_portal_role_request` (`tenant_id`,`request_id`),
                KEY `idx_portal_role_user` (`tenant_id`,`user_id`,`status`),
                CONSTRAINT `chk_portal_role_request_status` CHECK ((`status` in (_utf8mb4'PROCESSING',_utf8mb4'COMPLETED',_utf8mb4'FAILED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='门户角色分配请求幂等 Inbox';
              CREATE TABLE `sys_role` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '角色ID',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `role_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '角色编码',
                `role_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '角色名称',
                `data_scope` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT 'TENANT' COMMENT '数据范围: ALL/TENANT/DEPT_AND_BELOW/DEPT/SELF/CUSTOM',
                `sort` int DEFAULT '0' COMMENT '排序',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_role_tenant_code` (`tenant_id`,`role_code`),
                KEY `idx_role_tenant` (`tenant_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='角色表';
              CREATE TABLE `sys_role_dept` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `role_id` bigint NOT NULL COMMENT '角色ID',
                `dept_id` bigint NOT NULL COMMENT '组织单元ID',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_role_dept` (`role_id`,`dept_id`),
                KEY `idx_role` (`role_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='角色数据范围关联表';
              CREATE TABLE `sys_role_permission` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `role_id` bigint NOT NULL COMMENT '角色ID',
                `permission_id` bigint NOT NULL COMMENT '权限ID',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_role_permission` (`role_id`,`permission_id`),
                KEY `idx_role` (`role_id`),
                KEY `idx_permission` (`permission_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='角色权限关联表';
              CREATE TABLE `sys_tenant` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '租户ID',
                `tenant_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '租户编码',
                `tenant_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '租户名称',
                `domain` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '租户域名',
                `contact_name` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '联系人',
                `contact_phone` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '联系电话',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `tenant_code` (`tenant_code`),
                KEY `idx_tenant_code` (`tenant_code`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='租户表';
              CREATE TABLE `sys_token_blacklist` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `token_jti` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'Token JTI',
                `token_type` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '类型: ACCESS/REFRESH',
                `expire_time` datetime NOT NULL COMMENT '过期时间',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_token_jti` (`token_jti`),
                KEY `idx_expire_time` (`expire_time`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='Token黑名单表';
              CREATE TABLE `sys_user` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '用户ID',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `username` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '用户名',
                `password` varchar(256) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '密码',
                `nickname` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '昵称',
                `email` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '邮箱',
                `phone` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '手机号',
                `avatar` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '头像URL',
                `gender` tinyint DEFAULT '0' COMMENT '性别: 0-未知, 1-男, 2-女',
                `primary_unit_id` bigint DEFAULT NULL COMMENT '主组织单元ID',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_user_tenant_username` (`tenant_id`,`username`),
                KEY `idx_user_tenant` (`tenant_id`),
                KEY `idx_user_status` (`status`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户表';
              CREATE TABLE `sys_user_oauth_provider` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
                `user_id` bigint NOT NULL COMMENT '本地用户ID',
                `provider` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '提供商标识（github/google/wechat/gitee）',
                `provider_user_id` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '第三方用户ID',
                `provider_username` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '第三方用户名',
                `provider_email` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '第三方邮箱',
                `provider_avatar` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '第三方头像URL',
                `access_token` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '第三方访问令牌',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_provider_user` (`provider`,`provider_user_id`),
                KEY `idx_user_id` (`user_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户第三方身份关联表';
              CREATE TABLE `sys_user_role` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `user_id` bigint NOT NULL COMMENT '用户ID',
                `role_id` bigint NOT NULL COMMENT '角色ID',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_user_role` (`user_id`,`role_id`),
                KEY `idx_user` (`user_id`),
                KEY `idx_role` (`role_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户角色关联表';
              CREATE TABLE `sys_user_role_scope` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户 ID',
                `user_id` bigint NOT NULL COMMENT '用户 ID',
                `role_id` bigint NOT NULL COMMENT '角色 ID',
                `unit_id` bigint NOT NULL COMMENT '组织单元 ID',
                `scope_mode` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'SAME_UNIT' COMMENT '作用域模式: SAME_UNIT / UNIT_AND_BELOW',
                `status` tinyint DEFAULT '1' COMMENT '状态: 0-禁用, 1-启用',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_role_scope` (`tenant_id`,`user_id`,`role_id`,`unit_id`),
                KEY `idx_scope_tenant` (`tenant_id`),
                KEY `idx_scope_user` (`user_id`),
                KEY `idx_scope_role_unit` (`role_id`,`unit_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户角色作用域表';
              CREATE TABLE `sys_user_unit` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `user_id` bigint NOT NULL COMMENT '用户ID',
                `unit_id` bigint NOT NULL COMMENT '组织单元ID',
                `is_primary` tinyint DEFAULT '0' COMMENT '是否主组织: 0-否, 1-是',
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_user_unit` (`user_id`,`unit_id`),
                KEY `idx_user` (`user_id`),
                KEY `idx_unit` (`unit_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户组织关联表';
              CREATE TABLE `sys_xss_blacklist_rule` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `rule_name` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '规则名称',
                `rule_type` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '规则类型: HTML_TAG, EVENT_HANDLER, DANGEROUS_PROTOCOL, CUSTOM_PATTERN',
                `pattern` varchar(255) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '匹配模式（标签名/正则表达式）',
                `enabled` tinyint NOT NULL DEFAULT '1' COMMENT '规则开关: 0-禁用, 1-启用',
                `description` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '规则说明',
                `sort_order` int DEFAULT '0' COMMENT '排序',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_xss_rule_tenant` (`tenant_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='XSS黑名单规则表';
              CREATE TABLE `sys_xss_config` (
                `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键',
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `enabled` tinyint NOT NULL DEFAULT '0' COMMENT '全局开关: 0-关闭, 1-开启',
                `create_time` datetime DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_xss_config_tenant` (`tenant_id`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='XSS防护全局配置表';
              SET FOREIGN_KEY_CHECKS = 1;
