                `department` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `job_title` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `mobile` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `phone` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `email` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `decision_role` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `primary_flag` tinyint NOT NULL DEFAULT '0',
                `status` tinyint NOT NULL DEFAULT '1',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `primary_supplier_guard` bigint GENERATED ALWAYS AS ((case when ((`primary_flag` = 1) and (`status` = 1) and (`deleted` = 0)) then `supplier_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_contact_primary` (`tenant_id`,`primary_supplier_guard`),
                KEY `idx_srm_contact_supplier` (`tenant_id`,`supplier_id`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM供应商联系人';
              CREATE TABLE `srm_supplier_enrollment` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `user_id` bigint NOT NULL,
                `request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '幂等请求ID',
                `invite_id` bigint DEFAULT NULL,
                `status` varchar(30) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING_ROLE_ASSIGN',
                `retry_count` int NOT NULL DEFAULT '0',
                `last_error_code` varchar(100) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `next_retry_time` datetime DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_user_guard` bigint GENERATED ALWAYS AS ((case when ((`deleted` = 0) and (`status` in (_utf8mb4'PENDING_ROLE_ASSIGN',_utf8mb4'ROLE_ASSIGN_FAILED'))) then `user_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_enrollment_req` (`tenant_id`,`request_id`),
                UNIQUE KEY `uk_srm_enrollment_active_user` (`tenant_id`,`active_user_guard`),
                KEY `idx_srm_enrollment_user_status` (`tenant_id`,`user_id`,`status`,`deleted`),
                KEY `idx_srm_enrollment_supplier` (`tenant_id`,`supplier_id`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM门户入驻记录';
              CREATE TABLE `srm_supplier_invite` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `invite_code_hash` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '邀请码 SHA-256 哈希',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'ACTIVE',
                `expires_time` datetime NOT NULL,
                `max_uses` int NOT NULL DEFAULT '1',
                `used_count` int NOT NULL DEFAULT '0',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_invite_hash` (`tenant_id`,`invite_code_hash`),
                KEY `idx_srm_invite_status` (`tenant_id`,`status`,`expires_time`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM供应商邀请';
