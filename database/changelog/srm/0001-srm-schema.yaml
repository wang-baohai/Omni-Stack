                `category_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '品类编码',
                `level_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '等级编码 STRATEGIC/PREFERRED/QUALIFIED/ELIMINATED',
                `status` varchar(30) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'REGISTERING' COMMENT '状态',
                `assigned_time` datetime DEFAULT NULL COMMENT '分配时间',
                `last_evaluation_time` datetime DEFAULT NULL COMMENT '最近评估时间',
                `owner_user_id` bigint DEFAULT NULL,
                `owner_unit_id` bigint DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `workflow_request_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'Workflowå�¯åŠ¨è¯·æ±‚å¹‚ç­‰é”®',
                `workflow_business_key` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'Workflowä¸šåŠ¡é”® æ ¼å¼�supplierId:attempt',
                `workflow_model_version_id` bigint DEFAULT NULL COMMENT 'æœ¬è½®é€‰å®šçš„å·²å�‘å¸ƒæµ�ç¨‹æ¨¡åž‹ç‰ˆæœ¬ID',
                `process_instance_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT 'Workflowæµ�ç¨‹å®žä¾‹ID',
                `workflow_start_status` varchar(20) COLLATE utf8mb4_unicode_ci DEFAULT 'NOT_STARTED' COMMENT 'NOT_STARTED/PENDING/FAILED/STARTED',
                `workflow_completed_time` datetime DEFAULT NULL COMMENT 'Workflowå®¡æ‰¹å®Œæˆ�æ—¶é—´',
