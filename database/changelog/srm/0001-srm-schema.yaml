databaseChangeLog:
  - changeSet:
      id: srm-0001-baseline-schema
      author: omni-scaffold
      labels: database:srm
      runInTransaction: false
      comment: omni_srm 业务结构基线，不包含公共 MQ 表和种子数据
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE' AND table_name NOT IN ('DATABASECHANGELOG','DATABASECHANGELOGLOCK','sys_mq_message')
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `srm_evaluation` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `template_id` bigint NOT NULL,
                `evaluation_period` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '评估周期',
                `total_score` decimal(5,2) NOT NULL DEFAULT '0.00' COMMENT '百分制总分',
                `evaluator_user_id` bigint NOT NULL,
                `evaluation_time` datetime NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'COMPLETED',
                `owner_user_id` bigint NOT NULL COMMENT '负责人快照',
                `owner_unit_id` bigint NOT NULL COMMENT '组织快照',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_srm_eval_supplier` (`tenant_id`,`supplier_id`,`deleted`),
                KEY `idx_srm_eval_owner` (`tenant_id`,`owner_user_id`,`deleted`),
                KEY `idx_srm_eval_period` (`tenant_id`,`evaluation_period`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM绩效评估';
              CREATE TABLE `srm_evaluation_dimension` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `template_id` bigint NOT NULL,
                `indicator_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '指标名称',
                `weight` decimal(5,2) NOT NULL COMMENT '权重百分比',
                `sort` int NOT NULL DEFAULT '0',
                `status` tinyint NOT NULL DEFAULT '1',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_eval_dim_name` (`tenant_id`,`template_id`,`indicator_name`,`deleted`),
                KEY `idx_srm_eval_dim_tpl` (`tenant_id`,`template_id`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM评估维度';
              CREATE TABLE `srm_evaluation_item` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `evaluation_id` bigint NOT NULL,
                `dimension_id` bigint NOT NULL,
                `indicator_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `score` decimal(3,1) NOT NULL COMMENT '评分 1-5',
                `weight` decimal(5,2) NOT NULL COMMENT '权重快照',
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_eval_item_dim` (`tenant_id`,`evaluation_id`,`dimension_id`),
                KEY `idx_srm_eval_item_eval` (`tenant_id`,`evaluation_id`,`deleted`),
                CONSTRAINT `chk_srm_eval_item_score` CHECK (((`score` >= 1) and (`score` <= 5)))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM评估评分明细';
              CREATE TABLE `srm_evaluation_template` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `status` tinyint NOT NULL DEFAULT '1',
                `default_flag` tinyint NOT NULL DEFAULT '0',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_eval_tpl_name` (`tenant_id`,`name`,`deleted`),
                KEY `idx_srm_eval_tpl_status` (`tenant_id`,`default_flag`,`status`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM评估模板';
              CREATE TABLE `srm_event_inbox` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `event_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `event_type` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL,
                `source_service` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `aggregate_type` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `aggregate_id` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `payload` json NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'RECEIVED',
                `processed_time` datetime DEFAULT NULL,
                `error_message` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_inbox_event` (`tenant_id`,`event_id`),
                KEY `idx_srm_inbox_status` (`tenant_id`,`status`,`create_time`),
                CONSTRAINT `chk_srm_inbox_status` CHECK ((`status` in (_latin1'RECEIVED',_latin1'PROCESSED',_latin1'IGNORED',_latin1'FAILED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRMé¢†åŸŸäº‹ä»¶æ”¶ä»¶ç®±';
              CREATE TABLE `srm_quotation` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `rfq_id` bigint NOT NULL COMMENT 'Procurement RFQ ID；不建跨库外键',
                `rfq_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '询价单号快照',
                `supplier_name_snapshot` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '供应商名称快照',
                `request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '客户端幂等请求ID',
                `quotation_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `valid_until` datetime NOT NULL,
                `total_amount` decimal(19,4) NOT NULL DEFAULT '0.0000' COMMENT '服务端汇总金额',
                `currency_code` char(3) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'SUBMITTED',
                `version` int NOT NULL DEFAULT '1',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_supplier_guard` bigint GENERATED ALWAYS AS ((case when (`deleted` = 0) then `supplier_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_quote_request` (`tenant_id`,`request_id`),
                UNIQUE KEY `uk_srm_quote_active_supplier` (`tenant_id`,`rfq_id`,`active_supplier_guard`),
                KEY `idx_srm_quote_rfq_status` (`tenant_id`,`rfq_id`,`status`,`deleted`),
                KEY `idx_srm_quote_supplier_time` (`tenant_id`,`supplier_id`,`quotation_time`,`deleted`),
                KEY `idx_srm_quote_valid_until` (`tenant_id`,`status`,`valid_until`,`deleted`),
                CONSTRAINT `chk_srm_quote_status` CHECK ((`status` in (_utf8mb4'DRAFT',_utf8mb4'SUBMITTED',_utf8mb4'WITHDRAWN',_utf8mb4'EXPIRED'))),
                CONSTRAINT `chk_srm_quote_total` CHECK ((`total_amount` > 0))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM供应商报价';
              CREATE TABLE `srm_quotation_line` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `quotation_id` bigint NOT NULL,
                `rfq_line_id` bigint NOT NULL COMMENT 'Procurement RFQ行ID；不建跨库外键',
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '物料编码快照',
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '物料名称快照',
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '计量单位快照',
                `unit_price` decimal(19,6) NOT NULL,
                `quantity` decimal(19,6) NOT NULL COMMENT '询价数量快照',
                `line_amount` decimal(19,4) NOT NULL COMMENT '服务端计算行金额',
                `delivery_days` int NOT NULL DEFAULT '0',
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_rfq_line_guard` bigint GENERATED ALWAYS AS ((case when (`deleted` = 0) then `rfq_line_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_quote_line_active` (`tenant_id`,`quotation_id`,`active_rfq_line_guard`),
                KEY `idx_srm_quote_line_quote` (`tenant_id`,`quotation_id`,`deleted`),
                KEY `idx_srm_quote_line_rfq_line` (`tenant_id`,`rfq_line_id`,`deleted`),
                CONSTRAINT `chk_srm_quote_line_amount` CHECK ((`line_amount` > 0)),
                CONSTRAINT `chk_srm_quote_line_delivery` CHECK ((`delivery_days` between 0 and 3650)),
                CONSTRAINT `chk_srm_quote_line_price` CHECK ((`unit_price` > 0)),
                CONSTRAINT `chk_srm_quote_line_quantity` CHECK ((`quantity` > 0))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM供应商报价明细';
              CREATE TABLE `srm_quotation_request` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `request_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '客户端幂等请求ID',
                `quotation_id` bigint DEFAULT NULL COMMENT 'RESERVED阶段允许为空',
                `rfq_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `request_hash` char(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '规范化请求体SHA-256',
                `target_version` int DEFAULT NULL COMMENT '本请求成功产生的报价版本',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'RESERVED',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_quote_req_id` (`tenant_id`,`request_id`),
                UNIQUE KEY `uk_srm_quote_req_version` (`tenant_id`,`quotation_id`,`target_version`),
                KEY `idx_srm_quote_req_business` (`tenant_id`,`rfq_id`,`supplier_id`,`status`),
                KEY `idx_srm_quote_req_quote` (`tenant_id`,`quotation_id`,`create_time`),
                CONSTRAINT `chk_srm_quote_req_status` CHECK ((`status` in (_utf8mb4'RESERVED',_utf8mb4'COMPLETED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM报价请求幂等历史';
              CREATE TABLE `srm_risk_assessment` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `overall_level` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT 'RED/YELLOW/GREEN',
                `assessment_time` datetime NOT NULL,
                `assessor_user_id` bigint NOT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_srm_risk_assess_supplier` (`tenant_id`,`supplier_id`,`assessment_time`,`deleted`),
                CONSTRAINT `chk_srm_risk_assess_level` CHECK ((`overall_level` in (_utf8mb4'GREEN',_utf8mb4'YELLOW',_utf8mb4'RED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM综合风险评估';
              CREATE TABLE `srm_risk_criterion` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `indicator_type_id` bigint NOT NULL,
                `criterion_label` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `score` int NOT NULL,
                `risk_level` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL,
                `sort` int DEFAULT '0',
                `status` tinyint DEFAULT '1',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                KEY `idx_risk_criterion_type` (`indicator_type_id`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `srm_risk_indicator` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL,
                `indicator_type` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '指标类型',
                `indicator_value` varchar(200) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `criterion_id` bigint DEFAULT NULL,
                `score` int DEFAULT NULL,
                `risk_level` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'GREEN' COMMENT 'RED/YELLOW/GREEN',
                `assessment_time` datetime NOT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_srm_risk_ind_type` (`tenant_id`,`supplier_id`,`indicator_type`),
                KEY `idx_srm_risk_ind_supplier` (`tenant_id`,`supplier_id`,`indicator_type`,`deleted`),
                KEY `idx_srm_risk_ind_level` (`tenant_id`,`risk_level`,`deleted`),
                CONSTRAINT `chk_srm_risk_ind_level` CHECK ((`risk_level` in (_utf8mb4'GREEN',_utf8mb4'YELLOW',_utf8mb4'RED'))),
                CONSTRAINT `chk_srm_risk_ind_type` CHECK ((`indicator_type` in (_utf8mb4'FINANCIAL',_utf8mb4'COMPLIANCE',_utf8mb4'SUPPLY',_utf8mb4'COOPERATION',_utf8mb4'QUALITY',_utf8mb4'CERTIFICATE')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='SRM风险指标';
              CREATE TABLE `srm_risk_indicator_type` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `type_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `type_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `description` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `sort` int DEFAULT '0',
                `auto_calc` tinyint DEFAULT '0',
                `status` tinyint DEFAULT '1',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_risk_type_tenant_code` (`tenant_id`,`type_code`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `srm_risk_score_threshold` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `risk_level` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL,
                `min_score` int NOT NULL,
                `max_score` int NOT NULL,
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime DEFAULT NULL,
                `update_time` datetime DEFAULT NULL,
                `create_by` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_risk_threshold_level` (`tenant_id`,`risk_level`,`deleted`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE `srm_supplier` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL COMMENT '租户ID',
                `supplier_no` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '供应商编号',
                `name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '供应商名称',
                `normalized_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `supplier_type` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT '供应商类型',
                `industry_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '行业编码',
                `credit_code` varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT '统一社会信用代码',
                `website` varchar(300) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `phone` varchar(32) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
