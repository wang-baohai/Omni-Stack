                `material_id` bigint NOT NULL,
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `quantity` decimal(19,6) NOT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_line_no_guard` int GENERATED ALWAYS AS ((case when (`deleted` = 0) then `line_no` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_rfq_line_active` (`tenant_id`,`rfq_id`,`active_line_no_guard`),
                KEY `idx_proc_rfq_line_rfq` (`tenant_id`,`rfq_id`,`deleted`),
                KEY `idx_proc_rfq_line_material` (`tenant_id`,`material_id`,`deleted`),
                CONSTRAINT `chk_proc_rfq_line_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_rfq_line_no` CHECK ((`line_no` > 0)),
                CONSTRAINT `chk_proc_rfq_line_quantity` CHECK ((`quantity` > 0))
