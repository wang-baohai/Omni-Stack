                `active_supplier_guard` bigint GENERATED ALWAYS AS ((case when (`deleted` = 0) then `supplier_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_rfq_supplier_active` (`tenant_id`,`rfq_id`,`active_supplier_guard`),
                UNIQUE KEY `uk_proc_rfq_quote` (`tenant_id`,`quotation_id`),
                UNIQUE KEY `uk_proc_rfq_quote_request` (`tenant_id`,`quotation_request_id`),
                KEY `idx_proc_rfq_supplier_rfq` (`tenant_id`,`rfq_id`,`status`,`deleted`),
                KEY `idx_proc_rfq_supplier_supplier` (`tenant_id`,`supplier_id`,`status`,`deleted`),
                KEY `idx_proc_rfq_supplier_quote_time` (`tenant_id`,`quotation_time`,`deleted`),
                CONSTRAINT `chk_proc_rfq_supplier_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_rfq_supplier_quote_version` CHECK (((`quotation_version` is null) or (`quotation_version` > 0))),
                CONSTRAINT `chk_proc_rfq_supplier_status` CHECK ((`status` in (_utf8mb4'INVITED',_utf8mb4'QUOTED',_utf8mb4'EXPIRED',_utf8mb4'AWARDED',_utf8mb4'REJECTED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购询价供应商邀请';
              CREATE TABLE `proc_tenant_config` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `currency_code` char(3) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY',
                `initialized_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_tenant_guard` tinyint GENERATED ALWAYS AS ((case when (`deleted` = 0) then 1 else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
