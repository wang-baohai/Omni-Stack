databaseChangeLog:
  - changeSet:
      id: procurement-0001-baseline-schema
      author: omni-scaffold
      labels: database:procurement,adoption-baseline
      runInTransaction: false
      comment: omni_procurement 业务结构基线，不包含公共 MQ 表和种子数据
      preConditions:
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE' AND table_name NOT IN ('DATABASECHANGELOG','DATABASECHANGELOGLOCK','sys_mq_message')
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              SET FOREIGN_KEY_CHECKS = 0;
              CREATE TABLE `proc_approval_route` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `route_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `min_amount` decimal(19,4) NOT NULL DEFAULT '0.0000',
                `max_amount` decimal(19,4) DEFAULT NULL,
                `model_version_id` bigint NOT NULL,
                `priority` int NOT NULL DEFAULT '0',
                `status` varchar(16) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'ACTIVE',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_route_code_guard` varchar(64) COLLATE utf8mb4_unicode_ci GENERATED ALWAYS AS ((case when (`deleted` = 0) then `route_code` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_route_active_code` (`tenant_id`,`active_route_code_guard`),
                KEY `idx_proc_route_match` (`tenant_id`,`category_code`,`status`,`min_amount`,`max_amount`,`deleted`),
                CONSTRAINT `chk_proc_route_amount` CHECK (((`min_amount` >= 0) and ((`max_amount` is null) or (`max_amount` > `min_amount`)))),
                CONSTRAINT `chk_proc_route_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_route_priority` CHECK ((`priority` >= 0)),
                CONSTRAINT `chk_proc_route_status` CHECK ((`status` in (_utf8mb4'ACTIVE',_utf8mb4'INACTIVE')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='请购审批路由';
              CREATE TABLE `proc_event_inbox` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `event_id` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `event_type` varchar(128) COLLATE utf8mb4_unicode_ci NOT NULL,
                `source_service` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `aggregate_type` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `aggregate_id` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `payload` json NOT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'RECEIVED',
                `processed_time` datetime DEFAULT NULL,
                `error_message` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_inbox_event` (`tenant_id`,`event_id`),
                KEY `idx_proc_inbox_status` (`tenant_id`,`status`,`create_time`),
                CONSTRAINT `chk_proc_inbox_status` CHECK ((`status` in (_utf8mb4'RECEIVED',_utf8mb4'PROCESSED',_utf8mb4'IGNORED',_utf8mb4'FAILED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购领域事件收件箱';
              CREATE TABLE `proc_goods_receipt` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `gr_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `po_id` bigint NOT NULL,
                `receiver_user_id` bigint NOT NULL,
                `receive_time` datetime NOT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'DRAFT',
                `confirmed_time` datetime DEFAULT NULL,
                `confirmed_event_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_gr_no` (`tenant_id`,`gr_no`),
                UNIQUE KEY `uk_proc_gr_confirmed_event` (`tenant_id`,`confirmed_event_id`),
                KEY `idx_proc_gr_po_status` (`tenant_id`,`po_id`,`status`,`deleted`),
                KEY `idx_proc_gr_receiver_time` (`tenant_id`,`receiver_user_id`,`receive_time`,`deleted`),
                KEY `idx_proc_gr_owner` (`tenant_id`,`owner_user_id`,`owner_unit_id`,`deleted`),
                CONSTRAINT `chk_proc_gr_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_gr_status` CHECK ((`status` in (_utf8mb4'DRAFT',_utf8mb4'CONFIRMED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购收货单';
              CREATE TABLE `proc_goods_receipt_line` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `goods_receipt_id` bigint NOT NULL,
                `line_no` int NOT NULL,
                `po_line_id` bigint NOT NULL,
                `material_id` bigint NOT NULL,
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `asset_managed` tinyint NOT NULL DEFAULT '0',
                `ordered_quantity` decimal(19,6) NOT NULL,
                `received_quantity` decimal(19,6) NOT NULL,
                `quality_status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'PENDING',
                `quality_result_time` datetime DEFAULT NULL,
                `confirmed_event_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `quality_passed_event_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_line_no_guard` int GENERATED ALWAYS AS ((case when (`deleted` = 0) then `line_no` else NULL end)) STORED,
                `active_po_line_guard` bigint GENERATED ALWAYS AS ((case when (`deleted` = 0) then `po_line_id` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_gr_line_active` (`tenant_id`,`goods_receipt_id`,`active_line_no_guard`),
                UNIQUE KEY `uk_proc_gr_po_line_active` (`tenant_id`,`goods_receipt_id`,`active_po_line_guard`),
                KEY `idx_proc_gr_quality_event` (`tenant_id`,`quality_passed_event_id`),
                KEY `idx_proc_gr_line_receipt` (`tenant_id`,`goods_receipt_id`,`deleted`),
                KEY `idx_proc_gr_line_po` (`tenant_id`,`po_line_id`,`deleted`),
                KEY `idx_proc_gr_line_confirmed_event` (`tenant_id`,`confirmed_event_id`),
                KEY `idx_proc_gr_asset_candidate` (`tenant_id`,`asset_managed`,`quality_status`,`deleted`,`id`),
                CONSTRAINT `chk_proc_gr_line_asset` CHECK ((`asset_managed` in (0,1))),
                CONSTRAINT `chk_proc_gr_line_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_gr_line_no` CHECK ((`line_no` > 0)),
                CONSTRAINT `chk_proc_gr_line_ordered` CHECK ((`ordered_quantity` > 0)),
                CONSTRAINT `chk_proc_gr_line_quality` CHECK ((`quality_status` in (_utf8mb4'PASS',_utf8mb4'FAIL',_utf8mb4'PENDING'))),
                CONSTRAINT `chk_proc_gr_line_received` CHECK (((`received_quantity` > 0) and (`received_quantity` <= `ordered_quantity`)))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购收货明细';
              CREATE TABLE `proc_material` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `category_id` bigint NOT NULL,
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `specification` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `asset_managed` tinyint NOT NULL DEFAULT '0',
                `status` varchar(16) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'ACTIVE',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_material_code_guard` varchar(64) COLLATE utf8mb4_unicode_ci GENERATED ALWAYS AS ((case when (`deleted` = 0) then `material_code` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_material_active_code` (`tenant_id`,`active_material_code_guard`),
                KEY `idx_proc_material_category` (`tenant_id`,`category_id`,`status`,`deleted`),
                KEY `idx_proc_material_name` (`tenant_id`,`material_name`,`deleted`),
                CONSTRAINT `chk_proc_material_asset` CHECK ((`asset_managed` in (0,1))),
                CONSTRAINT `chk_proc_material_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_material_status` CHECK ((`status` in (_utf8mb4'ACTIVE',_utf8mb4'INACTIVE')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购物料目录';
              CREATE TABLE `proc_material_category` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `parent_id` bigint NOT NULL DEFAULT '0',
                `category_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `sort` int NOT NULL DEFAULT '0',
                `status` tinyint NOT NULL DEFAULT '1',
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_category_code_guard` varchar(50) COLLATE utf8mb4_unicode_ci GENERATED ALWAYS AS ((case when (`deleted` = 0) then `category_code` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_category_active_code` (`tenant_id`,`active_category_code_guard`),
                KEY `idx_proc_category_parent` (`tenant_id`,`parent_id`,`status`,`deleted`),
                CONSTRAINT `chk_proc_category_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_category_parent` CHECK ((`parent_id` >= 0)),
                CONSTRAINT `chk_proc_category_sort` CHECK ((`sort` >= 0)),
                CONSTRAINT `chk_proc_category_status` CHECK ((`status` in (0,1)))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购物料品类';
              CREATE TABLE `proc_purchase_order` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `po_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `rfq_id` bigint NOT NULL,
                `supplier_id` bigint NOT NULL COMMENT 'SRM供应商ID，不建跨库外键',
                `supplier_name_snapshot` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `quotation_id` bigint NOT NULL COMMENT 'SRM报价ID，不建跨库外键',
                `quotation_version` int NOT NULL,
                `title` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `total_amount` decimal(19,4) NOT NULL,
                `currency_code` char(3) COLLATE utf8mb4_unicode_ci NOT NULL,
                `status` varchar(24) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'DRAFT',
                `order_time` datetime DEFAULT NULL,
                `expected_delivery_date` date DEFAULT NULL,
                `actual_delivery_date` date DEFAULT NULL,
                `delivery_address` varchar(500) COLLATE utf8mb4_unicode_ci NOT NULL,
                `contact_name` varchar(100) COLLATE utf8mb4_unicode_ci NOT NULL,
                `contact_phone` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_po_no` (`tenant_id`,`po_no`),
                UNIQUE KEY `uk_proc_po_rfq` (`tenant_id`,`rfq_id`),
                UNIQUE KEY `uk_proc_po_quotation` (`tenant_id`,`quotation_id`,`quotation_version`),
                KEY `idx_proc_po_supplier_status` (`tenant_id`,`supplier_id`,`status`,`deleted`),
                KEY `idx_proc_po_owner` (`tenant_id`,`owner_user_id`,`owner_unit_id`,`deleted`),
                KEY `idx_proc_po_delivery` (`tenant_id`,`status`,`expected_delivery_date`,`deleted`),
                CONSTRAINT `chk_proc_po_currency` CHECK (regexp_like(`currency_code`,_utf8mb4'^[A-Z]{3}$')),
                CONSTRAINT `chk_proc_po_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_po_quote_version` CHECK ((`quotation_version` > 0)),
                CONSTRAINT `chk_proc_po_status` CHECK ((`status` in (_utf8mb4'DRAFT',_utf8mb4'SENT',_utf8mb4'CONFIRMED',_utf8mb4'PARTIAL_RECEIVED',_utf8mb4'RECEIVED',_utf8mb4'CLOSED',_utf8mb4'CANCELLED'))),
                CONSTRAINT `chk_proc_po_total` CHECK ((`total_amount` > 0))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购订单';
              CREATE TABLE `proc_purchase_order_line` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `po_id` bigint NOT NULL,
                `line_no` int NOT NULL,
                `rfq_line_id` bigint NOT NULL,
                `material_id` bigint NOT NULL,
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `quantity` decimal(19,6) NOT NULL,
                `unit_price` decimal(19,6) NOT NULL,
                `total_price` decimal(19,4) NOT NULL,
                `delivery_days` int NOT NULL DEFAULT '0',
                `expected_delivery_date` date DEFAULT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_line_no_guard` int GENERATED ALWAYS AS ((case when (`deleted` = 0) then `line_no` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_po_rfq_line` (`tenant_id`,`po_id`,`rfq_line_id`),
                UNIQUE KEY `uk_proc_po_line_active` (`tenant_id`,`po_id`,`active_line_no_guard`),
                KEY `idx_proc_po_line_po` (`tenant_id`,`po_id`,`deleted`),
                KEY `idx_proc_po_line_material` (`tenant_id`,`material_id`,`deleted`),
                CONSTRAINT `chk_proc_po_line_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_po_line_delivery` CHECK ((`delivery_days` between 0 and 3650)),
                CONSTRAINT `chk_proc_po_line_no` CHECK ((`line_no` > 0)),
                CONSTRAINT `chk_proc_po_line_price` CHECK ((`unit_price` > 0)),
                CONSTRAINT `chk_proc_po_line_quantity` CHECK ((`quantity` > 0)),
                CONSTRAINT `chk_proc_po_line_total` CHECK ((`total_price` > 0))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购订单明细';
              CREATE TABLE `proc_requisition` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `requisition_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `title` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `requester_user_id` bigint NOT NULL,
                `requester_unit_id` bigint NOT NULL,
                `reason` varchar(1000) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `primary_category_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `total_amount` decimal(19,4) NOT NULL DEFAULT '0.0000',
                `currency_code` char(3) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'DRAFT',
                `approval_attempt` int NOT NULL DEFAULT '0',
                `workflow_request_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `workflow_business_key` varchar(128) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `workflow_model_version_id` bigint DEFAULT NULL,
                `process_instance_id` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `workflow_start_status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'NOT_STARTED',
                `approved_time` datetime DEFAULT NULL,
                `workflow_completed_time` datetime DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_req_no` (`tenant_id`,`requisition_no`),
                UNIQUE KEY `uk_proc_req_workflow_request` (`tenant_id`,`workflow_request_id`),
                UNIQUE KEY `uk_proc_req_workflow_business` (`tenant_id`,`workflow_business_key`),
                KEY `idx_proc_req_requester_status` (`tenant_id`,`requester_user_id`,`status`,`deleted`),
                KEY `idx_proc_req_unit_status` (`tenant_id`,`requester_unit_id`,`status`,`deleted`),
                KEY `idx_proc_req_owner` (`tenant_id`,`owner_user_id`,`owner_unit_id`,`deleted`),
                KEY `idx_proc_req_process_instance` (`tenant_id`,`process_instance_id`),
                CONSTRAINT `chk_proc_req_attempt` CHECK ((`approval_attempt` >= 0)),
                CONSTRAINT `chk_proc_req_currency` CHECK (regexp_like(`currency_code`,_utf8mb4'^[A-Z]{3}$')),
                CONSTRAINT `chk_proc_req_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_req_status` CHECK ((`status` in (_utf8mb4'DRAFT',_utf8mb4'SUBMITTED',_utf8mb4'APPROVING',_utf8mb4'APPROVED',_utf8mb4'REJECTED',_utf8mb4'CANCELLED'))),
                CONSTRAINT `chk_proc_req_total` CHECK ((`total_amount` >= 0)),
                CONSTRAINT `chk_proc_req_workflow_start` CHECK ((`workflow_start_status` in (_utf8mb4'NOT_STARTED',_utf8mb4'PENDING',_utf8mb4'FAILED',_utf8mb4'STARTED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购请购单';
              CREATE TABLE `proc_requisition_line` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `requisition_id` bigint NOT NULL,
                `line_no` int NOT NULL,
                `material_id` bigint NOT NULL,
                `material_code` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `material_name` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `category_code` varchar(50) COLLATE utf8mb4_unicode_ci NOT NULL,
                `unit` varchar(32) COLLATE utf8mb4_unicode_ci NOT NULL,
                `quantity` decimal(19,6) NOT NULL,
                `estimated_unit_price` decimal(19,6) NOT NULL,
                `estimated_total_price` decimal(19,4) NOT NULL,
                `remark` varchar(500) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `active_line_no_guard` int GENERATED ALWAYS AS ((case when (`deleted` = 0) then `line_no` else NULL end)) STORED,
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_req_line_active` (`tenant_id`,`requisition_id`,`active_line_no_guard`),
                KEY `idx_proc_req_line_req` (`tenant_id`,`requisition_id`,`deleted`),
                KEY `idx_proc_req_line_material` (`tenant_id`,`material_id`,`deleted`),
                CONSTRAINT `chk_proc_req_line_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_req_line_no` CHECK ((`line_no` > 0)),
                CONSTRAINT `chk_proc_req_line_price` CHECK ((`estimated_unit_price` >= 0)),
                CONSTRAINT `chk_proc_req_line_quantity` CHECK ((`quantity` > 0)),
                CONSTRAINT `chk_proc_req_line_total` CHECK ((`estimated_total_price` >= 0))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购请购明细';
              CREATE TABLE `proc_rfq` (
                `id` bigint NOT NULL AUTO_INCREMENT,
                `tenant_id` bigint NOT NULL,
                `rfq_no` varchar(64) COLLATE utf8mb4_unicode_ci NOT NULL,
                `requisition_id` bigint NOT NULL,
                `title` varchar(200) COLLATE utf8mb4_unicode_ci NOT NULL,
                `quotation_deadline` datetime NOT NULL,
                `currency_code` char(3) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'CNY',
                `status` varchar(20) COLLATE utf8mb4_unicode_ci NOT NULL DEFAULT 'DRAFT',
                `sent_time` datetime DEFAULT NULL,
                `awarded_supplier_id` bigint DEFAULT NULL,
                `awarded_quotation_id` bigint DEFAULT NULL,
                `awarded_quotation_version` int DEFAULT NULL,
                `awarded_time` datetime DEFAULT NULL,
                `owner_user_id` bigint NOT NULL,
                `owner_unit_id` bigint NOT NULL,
                `version` int NOT NULL DEFAULT '0',
                `deleted` tinyint NOT NULL DEFAULT '0',
                `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                `update_time` datetime DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                `create_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                `update_by` varchar(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
                PRIMARY KEY (`id`),
                UNIQUE KEY `uk_proc_rfq_no` (`tenant_id`,`rfq_no`),
                KEY `idx_proc_rfq_requisition` (`tenant_id`,`requisition_id`,`status`,`deleted`),
                KEY `idx_proc_rfq_status_deadline` (`tenant_id`,`status`,`quotation_deadline`,`deleted`),
                KEY `idx_proc_rfq_owner` (`tenant_id`,`owner_user_id`,`owner_unit_id`,`deleted`),
                KEY `idx_proc_rfq_award` (`tenant_id`,`awarded_supplier_id`,`awarded_quotation_id`),
                CONSTRAINT `chk_proc_rfq_currency` CHECK (regexp_like(`currency_code`,_utf8mb4'^[A-Z]{3}$')),
                CONSTRAINT `chk_proc_rfq_deleted` CHECK ((`deleted` in (0,1))),
                CONSTRAINT `chk_proc_rfq_quote_version` CHECK (((`awarded_quotation_version` is null) or (`awarded_quotation_version` > 0))),
                CONSTRAINT `chk_proc_rfq_status` CHECK ((`status` in (_utf8mb4'DRAFT',_utf8mb4'SENT',_utf8mb4'CLOSED',_utf8mb4'AWARDED',_utf8mb4'CANCELLED')))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='采购询价单';
              CREATE TABLE `proc_rfq_line` (
                `id` bigint NOT NULL AUTO_INCREMENT,
