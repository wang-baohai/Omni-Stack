      WHERE permission.tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND (permission.permission_code = 'srm' OR permission.permission_code LIKE 'srm:%')
    expectedRows: 51
    expectedSha256: "3f0b4cfc21b43c143a06ee69bb765d245ce67a2270461e9ca1a43a9ea4d078a5"

  - id: srm-default-config
    module: srm
    database: omni_srm
    query: >-
      SELECT CONCAT_WS('|', 'template', name) AS seed_key
      FROM srm_evaluation_template
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default') AND deleted = 0
      UNION ALL SELECT CONCAT_WS('|', 'dimension', template.name, dimension.indicator_name)
      FROM srm_evaluation_dimension dimension
      JOIN srm_evaluation_template template ON template.id = dimension.template_id
      WHERE dimension.tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
      AND dimension.deleted = 0
      UNION ALL SELECT CONCAT_WS('|', 'risk-type', type_code)
      FROM srm_risk_indicator_type
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default') AND deleted = 0
      UNION ALL SELECT CONCAT_WS('|', 'risk-criterion', type.type_code, criterion.criterion_label)
      FROM srm_risk_criterion criterion JOIN srm_risk_indicator_type type ON type.id = criterion.indicator_type_id
      WHERE criterion.tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
      AND criterion.deleted = 0
      UNION ALL SELECT CONCAT_WS('|', 'threshold', risk_level) FROM srm_risk_score_threshold
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default') AND deleted = 0
    expectedRows: 29
    expectedSha256: "b050b5bfaff46f047f06c26969aab010ce2f85ca4a16c8d2754b2bf952122a9e"

  - id: procurement-role-catalog
