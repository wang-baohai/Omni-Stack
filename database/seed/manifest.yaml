      WHERE permission.tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND (permission.permission_code = 'asset' OR permission.permission_code LIKE 'asset:%')
    expectedRows: 27
    expectedSha256: "6c937abd1c207dbec482f26986333b40877e1be36f4867e46aa18fb404fcd2c8"

  - id: nacos-security-catalog
    module: nacos
    database: nacos_config
    query: >-
      SELECT CONCAT_WS('|', 'user', username) AS seed_key FROM users
      UNION ALL SELECT CONCAT_WS('|', 'role', username, role) FROM roles
      UNION ALL SELECT CONCAT_WS('|', 'permission', role, resource, action) FROM permissions
    expectedRows: 2
    expectedSha256: "e5e232ef54efc5d2745cf52b0e61bdfc97b50d274a6d3176a8dd9a92b758bd1b"

  - id: xxl-job-catalog
    module: xxl-job
    database: xxl_job
    query: >-
      SELECT CONCAT_WS('|', 'group', app_name) AS seed_key
      FROM xxl_job_group WHERE app_name = 'xxl-job-executor-sample'
      UNION ALL SELECT CONCAT_WS('|', 'job', job_group.app_name, job.executor_handler)
      FROM xxl_job_info job JOIN xxl_job_group job_group ON job_group.id = job.job_group
      WHERE job_group.app_name = 'xxl-job-executor-sample' AND job.executor_handler = 'demoJobHandler'
      UNION ALL SELECT CONCAT_WS('|', 'user', username) FROM xxl_job_user WHERE username = 'admin'
      UNION ALL SELECT CONCAT_WS('|', 'lock', lock_name) FROM xxl_job_lock WHERE lock_name = 'schedule_lock'
    # 这里只断言静态引导种子；各服务执行器和系统任务由运行时幂等注册，不能阻断 one-shot 迁移。
    expectedRows: 4
    expectedSha256: "0ece7d9707cf9c8097108a1ff7390c63aca5ceceaa120c70c85e81c7e1c16daf"
