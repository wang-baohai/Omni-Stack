# 兼容期模块 ID 镜像；scaffold/catalog/modules.yaml 是依赖和 provisioning 声明的单一事实来源，
# ModuleCatalogContractTest 强制两份 ID 与全部 provisioningSeedIds 一致。
modules:
  - id: platform
    enabledByDefault: true
  - id: auth
    enabledByDefault: true
  - id: base
    enabledByDefault: true
  - id: workflow
    enabledByDefault: true
  - id: crm
    enabledByDefault: true
  - id: srm
    enabledByDefault: true
  - id: procurement
    enabledByDefault: true
  - id: asset
    enabledByDefault: true
  - id: nacos
    enabledByDefault: true
  - id: xxl-job
    enabledByDefault: true

# 每个查询只返回不含密码、令牌和业务交易数据的稳定自然键投影。
# expectedSha256 是对 JDBC 列标签、类型和值生成规范串，按行排序后计算的 SHA-256。
assertions:
  - id: platform-default-tenant
    module: platform
    database: omni_auth
    query: >-
      SELECT tenant_code AS seed_key
      FROM sys_tenant WHERE tenant_code = 'default'
    expectedRows: 1
    expectedSha256: "b5b1bca0e3a6438bab2a8d8bbaabeffbc84e2be1a9bfb641dfda2fe9f078824c"

  - id: auth-default-root
    module: auth
    database: omni_auth
    query: >-
      SELECT CONCAT_WS('|', tenant.tenant_code, unit.type) AS seed_key
      FROM sys_org_unit unit JOIN sys_tenant tenant ON tenant.id = unit.tenant_id
      WHERE tenant.tenant_code = 'default' AND unit.parent_id = 0
    expectedRows: 1
    expectedSha256: "78fbed3d59cd18aebd3648eb4acfe49c7a33f62349472adf9c11e66bbb75e5b2"

  - id: auth-role-catalog
    module: auth
    provisioning:
      roleCodes: [SUPER_ADMIN, USER]
    database: omni_auth
    query: >-
      SELECT role_code AS seed_key
      FROM sys_role WHERE tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND role_code IN ('SUPER_ADMIN', 'USER')
    expectedRows: 2
    expectedSha256: "5931cd76aa95dc41953f9ad8eb0e32dfc8fb7021ebf065d094c92458e9a5116f"

  - id: auth-permission-catalog
    module: auth
    database: omni_auth
    query: >-
      SELECT CONCAT_WS('|', permission.permission_code, permission.type,
      COALESCE(parent.permission_code, '')) AS seed_key
      FROM sys_permission permission LEFT JOIN sys_permission parent ON parent.id = permission.parent_id
      WHERE permission.tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND (permission.permission_code = 'system' OR permission.permission_code LIKE 'system:%')
    expectedRows: 43
    expectedSha256: "1d960c285f8def5e12c16873c4a027ebf25eee65f6e64cc0684e21700b07b023"

  - id: auth-xss-defaults
    module: auth
    database: omni_auth
    query: >-
      SELECT 'config' AS seed_key FROM sys_xss_config
      WHERE tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      UNION ALL SELECT CONCAT_WS('|', 'rule', rule_name)
      FROM sys_xss_blacklist_rule
      WHERE tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
    expectedRows: 11
    expectedSha256: "b19d0aaac44f0496f5fde25fe83513d233a3cfcffd45acf60164d005897c38de"

  - id: base-permission-catalog
    module: base
    database: omni_auth
    query: >-
      SELECT CONCAT_WS('|', permission.permission_code, permission.type,
      COALESCE(parent.permission_code, '')) AS seed_key
      FROM sys_permission permission LEFT JOIN sys_permission parent ON parent.id = permission.parent_id
      WHERE permission.tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND (permission.permission_code IN ('base', 'dict:data:create', 'dict:data:delete', 'dict:data:list',
      'dict:data:refresh', 'dict:data:update', 'dict:type:create', 'dict:type:delete', 'dict:type:list',
      'dict:type:update', 'job', 'monitor') OR permission.permission_code LIKE 'base:%'
      OR permission.permission_code LIKE 'job:%')
    expectedRows: 27
    expectedSha256: "d09da27a1c1c2c138987decd7a35d95d47f5afc6ca8336a674e9fba4b762d906"

  - id: base-dictionary-catalog
    module: base
    database: omni_base
    query: >-
      SELECT CONCAT_WS('|', 'type', type_code) AS seed_key
      FROM sys_dict_type WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
      UNION ALL SELECT CONCAT_WS('|', 'data', type_code, dict_value) FROM sys_dict_data
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
    expectedRows: 101
    expectedSha256: "0dea7e2c5b2dcccf82ce2bea92fc9b809d5221b8b2541d8d0099313142e944a9"

  - id: base-job-type-catalog
    module: base
    database: omni_base
    query: >-
      SELECT type_code AS seed_key
