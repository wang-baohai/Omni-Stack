  - id: crm-default-config
    module: crm
    database: omni_crm
    query: >-
      SELECT 'config' AS seed_key
      FROM crm_tenant_config
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
      UNION ALL SELECT CONCAT_WS('|', 'pipeline', code)
      FROM crm_pipeline
      WHERE tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default') AND deleted = 0
      UNION ALL SELECT CONCAT_WS('|', 'stage', pipeline.code, stage.stage_code)
      FROM crm_pipeline_stage stage JOIN crm_pipeline pipeline ON pipeline.id = stage.pipeline_id
      WHERE stage.tenant_id = (SELECT id FROM omni_auth.sys_tenant WHERE tenant_code = 'default')
      AND stage.deleted = 0
    expectedRows: 8
    expectedSha256: "d09d264634dcd551bfacecbac3997e49faa59e8e76ea78ada4f77ce6ced047c8"

  - id: srm-role-catalog
    module: srm
    provisioning:
      roleCodes: [SRM_ADMIN, SRM_COMPLIANCE, SRM_DIRECTOR, SRM_MANAGER, SUPPLIER]
    database: omni_auth
    query: >-
      SELECT role_code AS seed_key
      FROM sys_role WHERE tenant_id = (SELECT id FROM sys_tenant WHERE tenant_code = 'default')
      AND role_code IN ('SRM_ADMIN', 'SRM_COMPLIANCE', 'SRM_DIRECTOR', 'SRM_MANAGER', 'SUPPLIER')
