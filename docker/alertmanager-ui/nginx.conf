log_format alertmanager_ui '$request_method $uri $status';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout alertmanager_ui;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 本地化页面仍调用同一个官方 API，查询参数及写操作按原协议透传。
    location ~ ^/(zh-CN|en-US|ja-JP|ko-KR)/(api/.*|lib/.*|favicon\.ico)$ {
        rewrite ^/(zh-CN|en-US|ja-JP|ko-KR)/(.*)$ /$2 break;
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
    }

    # 保留原管理 API、就绪检查和指标入口；Prometheus 使用内部后端地址。
    location /api/ {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
    }
    location /-/ {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
    }
    location = /metrics {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
