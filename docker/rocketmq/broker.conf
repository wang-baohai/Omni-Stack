# RocketMQ Broker 配置
# brokerIP1 设置为 host.docker.internal，使宿主机上的 Java 应用能访问 Broker
# docker-compose.yml 中通过 extra_hosts 将其映射到宿主机网关 IP
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = 127.0.0.1
