# ============================================================
# RocketMQ Broker 配置（Docker 内部网络版本）
# ============================================================
# brokerIP1 设为容器名，使同 Docker 网络内的后端服务能正确连接 Broker。
# 用于 docker-compose 全容器部署场景。
#
# 如需在宿主机运行后端（非 Docker），请使用 broker.conf（brokerIP1 = 127.0.0.1）
# ============================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = rocketmq-broker
