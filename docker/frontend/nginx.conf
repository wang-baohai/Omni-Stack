# ============================================================
# Omni-Stack 前端 Nginx 配置
# ============================================================
# 监听 3000 端口，提供 Vue SPA 静态文件，
# 并将 /api、/oauth2、/.well-known 请求反代至 Gateway 容器。
# ============================================================

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，运行时解析（避免容器重建后 IP 变更导致缓存失效）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 请求反代至 Gateway
    location /api/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 授权服务器点反代
    location /oauth2/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC Discovery 端点反代
    location /.well-known/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router History 模式 — 所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
