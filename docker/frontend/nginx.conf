# ============================================================
# Omni-Stack 前端 Nginx 配置
# ============================================================
# 监听 3000 端口，提供 Vue SPA 静态文件，
# 并将 /api、/oauth2、/.well-known 请求反代至 Gateway 容器。
# ============================================================

server {
    listen 3000;
    server_name localhost;

    # 增大请求头缓冲区，JWT token + X-User-Scopes 等头部可能超过 nginx 默认限制
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    root /usr/share/nginx/html;
    index index.html;

    # 静态页面与 API 使用同一套浏览器安全基线。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; form-action 'self' https://github.com https://gitee.com https://accounts.google.com" always;

    # Docker 内置 DNS，运行时解析（避免容器重建后 IP 变更导致缓存失效）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 请求反代至 Gateway
    location /api/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 授权服务器点反代
    location /oauth2/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC Discovery 端点反代
    location /.well-known/ {
        set $upstream_gateway http://omni-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router History 模式 — 所有未匹配路径回退到 index.html
    # HTML 响应设置无缓存头，确保浏览器始终加载最新版本
    location / {
        try_files $uri $uri/ /index.html;
        # location 内声明 add_header 后不会继承 server 级头，必须显式保留安全基线。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; form-action 'self' https://github.com https://gitee.com https://accounts.google.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 静态资源（JS/CSS）带内容 hash，可以长期缓存
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; form-action 'self' https://github.com https://gitee.com https://accounts.google.com" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
