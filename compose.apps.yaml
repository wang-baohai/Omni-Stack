# Omni-Stack 应用服务：同一服务只定义一次，通过 profiles 组合。
services:
  omni-auth:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-auth
    image: omni-auth:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OMNI_AUTH_HOST_PORT:-8100}:8080
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SERVER_MAX_HTTP_HEADER_SIZE: "32768"
      SPRING_PROFILES_ACTIVE: ${OMNI_RUNTIME_PROFILE:-default}
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: ${NACOS_CLIENT_ENABLED:-true}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: ${NACOS_CLIENT_ENABLED:-true}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/omni_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-auth:9900/
      XXL_JOB_EXECUTOR_IP: omni-auth
      XXL_JOB_EXECUTOR_PORT: "9900"
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      AUTH_ISSUER: http://omni-auth:8080
      AUTH_FRONTEND_BASE_URL: http://localhost:3000
      AUTH_OAUTH2_GITHUB_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/github/callback
      AUTH_OAUTH2_GITEE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/gitee/callback
      AUTH_OAUTH2_GOOGLE_REDIRECT_URI: http://localhost:8102/api/auth/oauth2/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITEE_CLIENT_ID: ${GITEE_CLIENT_ID:-}
      GITEE_CLIENT_SECRET: ${GITEE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_STATE_SECRET: ${OAUTH2_STATE_SECRET:?请在 .env 中配置 OAUTH2_STATE_SECRET}
      JWK_ENCRYPT_KEY: ${JWK_ENCRYPT_KEY:?请在 .env 中配置 JWK_ENCRYPT_KEY}
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
      NO_PROXY: localhost,127.0.0.1,mysql,redis,nacos
      XXL_JOB_EXECUTOR_ENABLED: ${XXL_JOB_ENABLED:-true}
      OMNI_MQLOG_RELAY_AUTO_REGISTER: ${OMNI_MQ_RELAY_ENABLED:-true}
      OMNI_MQLOG_RELAY_ENABLED: ${OMNI_MQ_RELAY_ENABLED:-true}
      SPRING_CLOUD_STREAM_FUNCTION_AUTODETECT: ${OMNI_MQ_AUTODETECT:-true}
      SPRING_CLOUD_FUNCTION_DEFINITION: ${OMNI_AUTH_FUNCTION_DEFINITION-portalRoleAssignFunction;tenantProvisionResultFunction}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
    profiles:
      - core
      - workflow
      - crm
      - supply-chain
      - full
  omni-base:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_NAME: omni-base
    image: omni-base:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OMNI_BASE_HOST_PORT:-8101}:8080
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${OMNI_RUNTIME_PROFILE:-default}
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: ${NACOS_CLIENT_ENABLED:-true}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: ${NACOS_CLIENT_ENABLED:-true}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/omni_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: omni_app
      SPRING_DATASOURCE_PASSWORD: ${OMNI_DB_PASSWORD:?请在 .env 中配置 OMNI_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
      SPRING_CLOUD_STREAM_ROCKETMQ_BINDER_NAME_SERVER: rocketmq-namesrv:9876
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_ADDRESS: http://omni-base:9901/
      XXL_JOB_EXECUTOR_IP: omni-base
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中配置 XXL_JOB_ACCESS_TOKEN}
      OMNI_INTERNAL_API_TOKEN: ${OMNI_INTERNAL_API_TOKEN:?请在 .env 中配置 OMNI_INTERNAL_API_TOKEN}
      XXL_JOB_EXECUTOR_ENABLED: ${XXL_JOB_ENABLED:-true}
      OMNI_MQLOG_RELAY_AUTO_REGISTER: ${OMNI_MQ_RELAY_ENABLED:-true}
      OMNI_MQLOG_RELAY_ENABLED: ${OMNI_MQ_RELAY_ENABLED:-true}
      SPRING_CLOUD_STREAM_FUNCTION_AUTODETECT: ${OMNI_MQ_AUTODETECT:-true}
      SPRING_CLOUD_FUNCTION_DEFINITION: ${OMNI_BASE_FUNCTION_DEFINITION-operlogConsumer;tenantProvisionRequestedFunction}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      omni-db-migrator:
        condition: service_completed_successfully
    profiles:
      - core
